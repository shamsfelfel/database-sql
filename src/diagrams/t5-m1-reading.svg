<g class="en"><text x="150" y="219" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">From SALES REPRESENTATIVE: one representative to many customers, one-to-many (1:M)</text></g><g class="ar"><text x="630" y="219" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‏من SALES REPRESENTATIVE: مندوب واحد لزبائن كثيرين، واحد إلى متعدّد (‎1:M)</text></g>
<rect x="40" y="237" width="700" height="56" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="258" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Nothing on the line changes: same halves, same crow's foot, same names.</text></g><g class="ar"><text x="724" y="258" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‏لا شيء على الخط يتغيّر: النصفان أنفسهما، ورِجل الغراب نفسها، والاسمان أنفسهما.</text></g>
<g class="en"><text x="56" y="277" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Same foreign key too: customers.rep_id. One relationship, two readings.</text></g><g class="ar"><text x="724" y="277" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏والمفتاح الأجنبي نفسه أيضًا: customers.rep_id. علاقة واحدة بقراءتين.</text></g></svg>
