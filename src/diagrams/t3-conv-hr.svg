<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" direction="ltr" role="img" aria-labelledby="t3-conv-hr-t">
<title id="t3-conv-hr-t">The H.R. ERD drawn by the convention: DEPARTMENT, EMPLOYEE and JOB as softboxes with marked attributes; work in / responsible for and hold / held by as lines with solid and dashed halves, single toes and crow's feet / مخطّط الموارد البشرية مرسومًا وفق العُرف: DEPARTMENT وEMPLOYEE وJOB صناديقَ مستديرة بخصائص مُعلَّمة؛ وwork in / responsible for وhold / held by خطوطًا بأنصاف متّصلة ومتقطّعة، وأصابع مفردة وأقدام غراب</title>
<g class="en"><text x="450.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 2 — every mark by the convention</text></g><g class="ar"><text x="450.0" y="24" text-anchor="middle" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">الإصدار 2 — كل علامة وفق العُرف</text></g>
<rect x="30" y="50" width="180" height="82" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="120.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">DEPARTMENT</text>
<text x="44" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Department ID</text>
<text x="44" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Name</text>
<rect x="360" y="50" width="200" height="158" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="460.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">EMPLOYEE</text>
<text x="374" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Employee ID</text>
<text x="374" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* First Name</text>
<text x="374" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Last Name</text>
<text x="374" y="151" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Hire Date</text>
<text x="374" y="170" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Salary</text>
<text x="374" y="189" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">o Commission</text>
<rect x="710" y="50" width="160" height="120" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="790.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">JOB</text>
<text x="724" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Job ID</text>
<text x="724" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Title</text>
<text x="724" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Max Salary</text>
<text x="724" y="151" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Min Salary</text>
<path d="M210 100 L285 100" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M285 100 L360 100" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M346 100 L360 92" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M346 100 L360 100" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M346 100 L360 108" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="216" y="92" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">responsible for</text>
<text x="352" y="118" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">work in</text>
<path d="M560 100 L635 100" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M635 100 L710 100" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M574 100 L560 92" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M574 100 L560 100" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M574 100 L560 108" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="580" y="92" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">hold</text>
<text x="702" y="118" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">held by</text>
<rect x="30" y="228" width="840" height="96" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:1"/>
<text x="46" y="251" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each EMPLOYEE must work in one and only one DEPARTMENT.</text>
<text x="46" y="271" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each DEPARTMENT may be responsible for one or more EMPLOYEEs.</text>
<text x="46" y="291" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each EMPLOYEE must hold one and only one JOB.</text>
<text x="46" y="311" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each JOB may be held by one or more EMPLOYEEs.</text>
<rect x="30" y="342" width="840" height="96" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="46" y="365" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Softbox, name SINGULAR and UPPERCASE · # UID · * mandatory · o optional</text></g><g class="ar"><text x="854" y="365" text-anchor="start" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">صندوق مستدير، واسم مفرد بأحرف كبيرة · # المعرّف الفريد · * إلزامية · o اختيارية</text></g>
<g class="en"><text x="46" y="385" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Relationship names in lowercase, each beside the entity its sentence starts from</text></g><g class="ar"><text x="854" y="385" text-anchor="start" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">أسماء العلاقات بأحرف صغيرة، كلٌّ بجانب الكيان الذي تبدأ منه جملته</text></g>
<g class="en"><text x="46" y="405" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Solid half = must, dashed half = may · single toe = one and only one, crow's foot = one or more</text></g><g class="ar"><text x="854" y="405" text-anchor="start" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">النصف المتّصل = يجب، والمتقطّع = قد · الإصبع الواحدة = واحد فقط لا غير، وقدم الغراب = واحد أو أكثر</text></g>
<g class="en"><text x="46" y="425" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Any reader decodes this diagram the same way, without asking its author.</text></g><g class="ar"><text x="854" y="425" text-anchor="start" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">يفكّ أيّ قارئ رموز هذا المخطّط بالطريقة نفسها، دون أن يسأل مؤلّفه.</text></g>
</svg>
