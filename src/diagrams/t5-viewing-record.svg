<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" direction="ltr" role="img" aria-labelledby="t5-viewing-record-t">
<title id="t5-viewing-record-t">Version 2: TV SHOW on / VIEWING RECORD for / PERSON on: the intersection entity VIEWING RECORD with o Rating, crow's feet at VIEWING RECORD on both lines / الإصدار 2: TV SHOW on / VIEWING RECORD for / PERSON on: كيان التقاطع VIEWING RECORD مع o Rating، ورِجلا الغراب عند VIEWING RECORD في الخطين</title>
<g class="en"><text x="430.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 2 — resolved with VIEWING RECORD</text></g><g class="ar"><text x="430.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">‏الإصدار 2 — حُلّت بـ VIEWING RECORD</text></g>
