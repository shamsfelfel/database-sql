<rect x="20" y="156" width="820" height="98" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<text x="36" y="180" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each TV SHOW may be on one or more VIEWING RECORDs.</text>
<text x="36" y="201" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each VIEWING RECORD must be for one and only one TV SHOW.</text>
<text x="36" y="222" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each VIEWING RECORD must be for one and only one PERSON.</text>
<text x="36" y="243" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each PERSON may be on one or more VIEWING RECORDs.</text>
<rect x="20" y="266" width="820" height="54" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="36" y="288" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">One viewing record = one person watching one show. Rating has a home.</text></g><g class="ar"><text x="824" y="288" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‏سجلّ مشاهدة واحد = شخص واحد يشاهد برنامجًا واحدًا. وصار لـ Rating بيت.</text></g>
<g class="en"><text x="36" y="307" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">The slides draw VIEWING RECORD with no attributes; Rating is Lesson 4's hidden attribute.</text></g><g class="ar"><text x="824" y="307" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏ترسم الشرائح VIEWING RECORD بلا خصائص؛ وRating هي الخاصية المخفية من الدرس 4.</text></g>
</svg>