<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" direction="ltr" role="img" aria-labelledby="t5-uid-copied-t">
<title id="t5-uid-copied-t">Version 1: ENROLLMENT with # Student ID and # Subject ID typed in as attributes, and no bars: the box repeats what the two lines already say / الإصدار 1: ENROLLMENT مع # Student ID و# Subject ID مكتوبتين خاصيتين، وبلا قضبان: الصندوق يكرّر ما يقوله الخطّان أصلًا</title>
<g class="en"><text x="430.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 1 — the parents' IDs typed into the box</text></g><g class="ar"><text x="430.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">‏الإصدار 1 — معرّفا الأبوين مكتوبان داخل الصندوق</text></g>
<rect x="20" y="50" width="180" height="99" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="110.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">STUDENT</text>
<text x="32" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># ID</text>
<text x="32" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* First Name</text>
<text x="32" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Last Name</text>
<rect x="340" y="50" width="180" height="99" rx="10" style="fill:var(--dg-bad-soft, var(--accent-soft));stroke:var(--dg-bad, var(--accent));stroke-width:2"/>
<text x="430.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">ENROLLMENT</text>
<text x="352" y="94" text-anchor="start" style="fill:var(--dg-bad, var(--text));font-family:var(--mono, monospace);font-size:12.5px;font-weight:700"># Student ID</text>
<text x="352" y="113" text-anchor="start" style="fill:var(--dg-bad, var(--text));font-family:var(--mono, monospace);font-size:12.5px;font-weight:700"># Subject ID</text>
<text x="352" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">o Grade</text>
<rect x="660" y="50" width="180" height="80" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="750.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">SUBJECT</text>
<text x="672" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># ID</text>
<text x="672" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Name</text>
<path d="M200 95 L270.0 95" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M270.0 95 L340 95" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M326 95 L340 87" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M326 95 L340 95" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M326 95 L340 103" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="208" y="85" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">enrols for</text>
<text x="312" y="117" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">for</text>
<path d="M520 95 L590.0 95" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M590.0 95 L660 95" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M534 95 L520 87" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M534 95 L520 95" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M534 95 L520 103" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="548" y="85" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">for</text>
<text x="652" y="117" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">subject of</text>
<g class="en"><text x="430" y="170" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11px">copied from the parents</text></g><g class="ar"><text x="430" y="170" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12px">‏منسوختان من الأبوين</text></g>
<rect x="20" y="196" width="820" height="98" rx="6" style="fill:var(--dg-bad-soft, var(--surface));stroke:var(--dg-bad, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="36" y="218" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Defect: the box says twice what the lines already say once.</text></g><g class="ar"><text x="824" y="218" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‏العيب: الصندوق يقول مرّتين ما يقوله الخطّان مرّة واحدة.</text></g>
<g class="en"><text x="36" y="237" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">The line to STUDENT already ties each enrollment to one student; # Student ID restates it as an attribute.</text></g><g class="ar"><text x="824" y="237" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏الخط إلى STUDENT يربط كل تسجيل بطالب واحد أصلًا؛ و‎# Student ID‎ تعيد قوله خاصيةً.</text></g>
<g class="en"><text x="36" y="256" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">In an ERD a link is a line. The student_id column appears only when the line becomes a table.</text></g><g class="ar"><text x="824" y="256" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏في المخطّط الرابط خطّ. ولا يظهر العمود student_id إلا حين يصير الخط جدولًا.</text></g>
<g class="en"><text x="36" y="275" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Nothing here says the UID comes from the relationships — and that is what the slides draw.</text></g><g class="ar"><text x="824" y="275" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏ولا شيء هنا يقول إن المعرّف يأتي من العلاقات — وهذا ما ترسمه الشرائح.</text></g>
</svg>
