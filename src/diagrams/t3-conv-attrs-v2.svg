<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" direction="ltr" role="img" aria-labelledby="t3-conv-attrs-v2-t">
<title id="t3-conv-attrs-v2-t">Version 2: the same attributes marked - # for the unique identifier, * for mandatory, o for the optional Commission / الإصدار 2: الخصائص نفسها مُعلَّمة - # للمعرّف الفريد، و* للإلزامية، وo لخاصية Commission الاختيارية</title>
<g class="en"><text x="450.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 2 — # for the UID, * mandatory, o optional</text></g><g class="ar"><text x="450.0" y="24" text-anchor="middle" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">الإصدار 2 — # للمعرّف الفريد، و* إلزامية، وo اختيارية</text></g>
<rect x="40" y="50" width="230" height="158" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="155.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">EMPLOYEE</text>
<text x="54" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Employee ID</text>
<text x="54" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* First Name</text>
<text x="54" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Last Name</text>
<text x="54" y="151" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Hire Date</text>
<text x="54" y="170" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Salary</text>
<text x="54" y="189" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">o Commission</text>
<rect x="335" y="50" width="230" height="82" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="450.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">DEPARTMENT</text>
<text x="349" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Department ID</text>
<text x="349" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Name</text>
<rect x="630" y="50" width="230" height="120" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="745.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">JOB</text>
<text x="644" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Job ID</text>
<text x="644" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Title</text>
<text x="644" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Max Salary</text>
<text x="644" y="151" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Min Salary</text>
<rect x="335" y="150" width="230" height="76" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="351" y="173" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">#  unique identifier</text></g><g class="ar"><text x="549" y="173" text-anchor="start" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‏#  المعرّف الفريد</text></g>
<g class="en"><text x="351" y="193" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">*  mandatory: a value</text></g><g class="ar"><text x="549" y="193" text-anchor="start" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‏*  إلزامية: لها قيمة دائمًا</text></g>
<g class="en"><text x="351" y="213" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">o  optional: may be empty</text></g><g class="ar"><text x="549" y="213" text-anchor="start" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‏o  اختيارية: قد تبقى فارغة</text></g>
<rect x="40" y="228" width="820" height="76" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="251" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Read each line by its first mark: Employee ID identifies; Salary must have a value; Commission may not.</text></g><g class="ar"><text x="844" y="251" text-anchor="start" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">اقرأ كل سطر بعلامته الأولى: Employee ID يُعرِّف، وSalary لا بدّ لها من قيمة، وCommission قد لا تكون لها.</text></g>
<g class="en"><text x="56" y="271" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">A UID is always mandatory too, so this track writes # * before it.</text></g><g class="ar"><text x="844" y="271" text-anchor="start" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">والمعرّف الفريد إلزامي دائمًا أيضًا، فيكتب هذا المسار قبله # *.</text></g>
<g class="en"><text x="56" y="291" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Dana Smith, with no commission, fits. A row with no salary does not.</text></g><g class="ar"><text x="844" y="291" text-anchor="start" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏Dana Smith، بلا عمولة، تتّسع لها. والصفّ الذي بلا راتب لا يتّسع.</text></g>
</svg>
