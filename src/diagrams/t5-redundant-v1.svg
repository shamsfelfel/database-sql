<g class="en"><text x="46" y="249" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Defect: the lower line is redundant. A student's supervisor is already the supervisor of the student's study group.</text></g><g class="ar"><text x="824" y="249" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‏العيب: الخط السفلي زائد. فمشرف الطالب هو أصلًا مشرف مجموعة الدراسة التي ينتمي إليها.</text></g>
<g class="en"><text x="46" y="268" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Two lines record one fact, so they can disagree: Omar's group says Rana, his own line says Khaled.</text></g><g class="ar"><text x="824" y="268" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏خطّان يسجّلان حقيقة واحدة، فقد يختلفان: مجموعة Omar تقول Rana، وخطّه الخاص يقول Khaled.</text></g>
<rect x="30" y="290" width="810" height="30" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<text x="46" y="310" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">STUDENT --join--&gt; STUDY GROUP --supervised by--&gt; TEACHER   = the lower line, derived</text></svg>
