<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" direction="ltr" role="img" aria-labelledby="t5-barred-enrollment-t">
<title id="t5-barred-enrollment-t">The slides' barred relationships: a bar across each line at ENROLLMENT, next to the crow's foot; the UID of ENROLLMENT is its STUDENT plus its SUBJECT, a composite UID / العلاقات المقضّبة في الشرائح: قضيب يعترض كل خط عند ENROLLMENT بجوار رِجل الغراب؛ ومعرّف ENROLLMENT هو طالبه مع مادّته، معرّف مركّب</title>
<g class="en"><text x="430.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Barred relationships — the UID comes from the parents</text></g><g class="ar"><text x="430.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">‏العلاقات المقضّبة — المعرّف يأتي من الأبوين</text></g>
<rect x="20" y="50" width="180" height="99" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="110.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">STUDENT</text>
<text x="32" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># ID</text>
<text x="32" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* First Name</text>
<text x="32" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Last Name</text>
<rect x="340" y="50" width="180" height="61" rx="10" style="fill:var(--dg-good-soft, var(--accent-soft));stroke:var(--dg-good, var(--accent));stroke-width:2"/>
<text x="430.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">ENROLLMENT</text>
<text x="352" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">o Grade</text>
<rect x="660" y="50" width="180" height="80" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="750.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">SUBJECT</text>
<text x="672" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># ID</text>
<text x="672" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Name</text>
<path d="M200 95 L270.0 95" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M270.0 95 L340 95" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M326 95 L340 87" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M326 95 L340 95" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M326 95 L340 103" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M318 85 L318 105" style="stroke:var(--dg-good, var(--text));stroke-width:2.6;fill:none"/>
<text x="208" y="85" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">enrols for</text>
<text x="312" y="117" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">for</text>
<path d="M520 95 L590.0 95" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M590.0 95 L660 95" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M534 95 L520 87" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M534 95 L520 95" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M534 95 L520 103" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M542 85 L542 105" style="stroke:var(--dg-good, var(--text));stroke-width:2.6;fill:none"/>
<text x="548" y="85" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">for</text>
<text x="652" y="117" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">subject of</text>
<g class="en"><text x="318" y="148" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:11px">bar</text></g><g class="ar"><text x="318" y="148" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:12px">‏قضيب</text></g>
<path d="M318 136 L318 108" style="stroke:var(--dg-text-soft, var(--text-soft));stroke-width:1;fill:none"/>
<g class="en"><text x="542" y="148" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:11px">bar</text></g><g class="ar"><text x="542" y="148" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:12px">‏قضيب</text></g>
<path d="M542 136 L542 108" style="stroke:var(--dg-text-soft, var(--text-soft));stroke-width:1;fill:none"/>
<g class="en"><text x="430" y="148" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11px">no # inside</text></g><g class="ar"><text x="430" y="148" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12px">‏لا ‎#‎ في الداخل</text></g>
<rect x="20" y="170" width="820" height="104" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<text x="36" y="194" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each STUDENT may enrol for one or more ENROLLMENTs.</text>
<text x="36" y="215" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each ENROLLMENT must be for one and only one STUDENT.</text>
<text x="36" y="236" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each ENROLLMENT must be for one and only one SUBJECT.</text>
<text x="36" y="257" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each SUBJECT may be the subject of one or more ENROLLMENTs.</text>
<rect x="20" y="288" width="820" height="79" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="36" y="310" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Two bars at ENROLLMENT: it is identified by its STUDENT and its SUBJECT, together.</text></g><g class="ar"><text x="824" y="310" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‏قضيبان عند ENROLLMENT: يُعرَف بطالبه ومادّته معًا.</text></g>
<g class="en"><text x="36" y="329" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">The bar sits at the child end, just beyond the crow's foot. The diamond, for comparison, sits mid-line.</text></g><g class="ar"><text x="824" y="329" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏يقع القضيب عند طرف الابن، بعد رِجل الغراب مباشرة. أمّا المعيَّن، للمقارنة، ففي منتصف الخط.</text></g>
<g class="en"><text x="36" y="348" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Neither part is unique alone — Sara has two enrollments, Maths has two. The pair is: a composite UID.</text></g><g class="ar"><text x="824" y="348" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏لا جزء فريد وحده — لـ Sara تسجيلان، وللرياضيات تسجيلان. أمّا الزوج ففريد: معرّف مركّب.</text></g>
</svg>
