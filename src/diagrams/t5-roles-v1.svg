<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 355" direction="ltr" role="img" aria-labelledby="t5-roles-v1-t">
<title id="t5-roles-v1-t">TEACHER and STUDENT drawn as two unrelated entities, each with its own name and phone: Rana Saad is stored twice / TEACHER وSTUDENT مرسومان كيانين منفصلين، لكلٍّ منهما اسمه وهاتفه: Rana Saad مخزّنة مرّتين</title>
<g class="en"><text x="430" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 1: one person, stored as two strangers</text></g><g class="ar"><text x="430" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">‏الإصدار 1: شخص واحد، مخزَّن غريبَين</text></g>
<rect x="60" y="50" width="260" height="133" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="190.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">TEACHER</text>
<text x="74" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># ID</text>
<text x="74" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* First Name</text>
<text x="74" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Last Name</text>
<text x="74" y="151" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Phone</text>
<text x="74" y="170" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Hire Date</text>
<rect x="540" y="50" width="260" height="133" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="670.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">STUDENT</text>
<text x="554" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># ID</text>
<text x="554" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* First Name</text>
<text x="554" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Last Name</text>
<text x="554" y="151" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Phone</text>
<text x="554" y="170" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Start Date</text>
<rect x="60" y="200" width="740" height="58" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<text x="76" y="223" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">TEACHER  31    Rana  Saad  0599-120120  2019-09-01</text>
<text x="76" y="244" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">STUDENT  1005  Rana  Saad  0599-120120  2026-10-01</text>
<rect x="60" y="266" width="740" height="75" rx="6" style="fill:var(--dg-bad-soft, var(--surface));stroke:var(--dg-bad, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="76" y="287" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Defect: the same person's name and phone are stored twice.</text></g><g class="ar"><text x="784" y="287" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‏العيب: اسم الشخص نفسه وهاتفه مخزّنان مرّتين.</text></g>
<g class="en"><text x="76" y="306" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Rana changes her phone; one row is updated and the other is not: an update anomaly.</text></g><g class="ar"><text x="784" y="306" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏تغيّر Rana هاتفها، فيُحدَّث صفّ ولا يُحدَّث الآخر: شذوذ تحديث.</text></g>
<g class="en"><text x="76" y="325" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">And nothing in the model says the two rows are one person.</text></g><g class="ar"><text x="784" y="325" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏ولا شيء في النموذج يقول إن الصفّين شخص واحد.</text></g></svg>
