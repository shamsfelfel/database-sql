<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 504" direction="ltr" role="img" aria-labelledby="t4-exam-v3-t">
<title id="t4-exam-v3-t">EXAM, version 3: common attributes and the take relationship drawn once on EXAM; MIDTERM and FINAL keep their own attribute and QUIZ its own relationship to BONUS QUESTION / EXAM، الإصدار 3: الخصائص المشتركة وعلاقة take مرسومة مرّة واحدة على EXAM؛ ويحتفظ MIDTERM وFINAL بخاصية كلٍّ منهما، وQUIZ بعلاقته الخاصّة مع BONUS QUESTION</title>
<g class="en"><text x="450.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 3 — the relationship lifted too (the lecturer's model)</text></g><g class="ar"><text x="450.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">الإصدار 3 — والعلاقة مرفوعة أيضًا (نموذج المحاضِرة)</text></g>
<rect x="330" y="50" width="320" height="324" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
