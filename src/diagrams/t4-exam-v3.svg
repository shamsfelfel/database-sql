<text x="200" y="110" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">take</text>
<text x="314" y="140" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">taken by</text>
<rect x="30" y="394" width="850" height="84" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="46" y="417" text-anchor="start" style="fill:var(--dg-good, var(--text));font-family:var(--font, sans-serif);font-size:12px">Fixed: one take line, drawn on EXAM. Every QUIZ, MIDTERM and FINAL inherits it.</text></g><g class="ar"><text x="864" y="417" text-anchor="start" direction="rtl" style="fill:var(--dg-good, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">أُصلح: خطّ take واحد، مرسوم على EXAM. ويرثه كل QUIZ وMIDTERM وFINAL.</text></g>
<g class="en"><text x="46" y="437" text-anchor="start" style="fill:var(--dg-good, var(--text));font-family:var(--font, sans-serif);font-size:12px">Own properties stay inside: MIDTERM and FINAL an attribute each, QUIZ a relationship.</text></g><g class="ar"><text x="864" y="437" text-anchor="start" direction="rtl" style="fill:var(--dg-good, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">وتبقى السمات الخاصّة في الداخل: لـ MIDTERM ولـ FINAL خاصية لكلٍّ منهما، ولـ QUIZ علاقة.</text></g>
<g class="en"><text x="46" y="457" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Every QUIZ, MIDTERM or FINAL is an EXAM; every EXAM is a QUIZ, a MIDTERM or a FINAL.</text></g><g class="ar"><text x="864" y="457" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">كل QUIZ أو MIDTERM أو FINAL هو EXAM؛ وكل EXAM هو QUIZ أو MIDTERM أو FINAL.</text></g>
</svg>
