<g class="en"><text x="730" y="325" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">DOG is the entity; breeds are its instances</text></g><g class="ar"><text x="730" y="325" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">DOG هو الكيان، والسلالات نُسخه</text></g>
