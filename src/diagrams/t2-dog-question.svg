<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" direction="ltr" role="img" aria-labelledby="t2-dog-question-t">
<title id="t2-dog-question-t">DOG as an instance of ANIMAL, and DOG as an entity whose instances are breeds / DOG نسخةً من ANIMAL، وDOG كيانًا نُسخه السلالات</title>
<g class="en"><text x="480" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Is DOG an entity or an instance? It depends on the business</text></g><g class="ar"><text x="480" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">هل DOG كيان أم نسخة؟ هذا يعتمد على العمل</text></g>
<rect x="20" y="44" width="420" height="300" rx="6" style="fill:var(--dg-cluster-fill, var(--surface-2));stroke:var(--dg-cluster-stroke, var(--text-soft));stroke-width:1"/>
