<g class="en"><text x="230" y="70" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:700">Business A — many kinds of animal</text></g><g class="ar"><text x="230" y="70" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:700">العمل أ — أنواع كثيرة من الحيوانات</text></g>
<g class="en"><text x="730" y="70" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:700">Business B — a dog-breeding business</text></g><g class="ar"><text x="730" y="70" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:700">العمل ب — عمل لتربية الكلاب</text></g>
