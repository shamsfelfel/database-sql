<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" direction="ltr" role="img" aria-labelledby="t3-conv-rels-v1-t">
<title id="t3-conv-rels-v1-t">Version 1: DEPARTMENT, EMPLOYEE and JOB joined by plain arrows, each named once in capitals in the middle of the line - WORKS IN and HOLDS / الإصدار 1: DEPARTMENT وEMPLOYEE وJOB موصولة بأسهم عادية، كل سهم مسمّى مرّة واحدة بأحرف كبيرة في منتصف الخط - WORKS IN وHOLDS</title>
<g class="en"><text x="450.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 1 — arrows, one capitalised name in the middle</text></g><g class="ar"><text x="450.0" y="24" text-anchor="middle" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">الإصدار 1 — أسهم، واسم واحد بأحرف كبيرة في المنتصف</text></g>
<rect x="30" y="50" width="180" height="82" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="120.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">DEPARTMENT</text>
<text x="44" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Department ID</text>
<text x="44" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Name</text>
<rect x="360" y="50" width="200" height="158" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="460.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">EMPLOYEE</text>
<text x="374" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Employee ID</text>
<text x="374" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* First Name</text>
<text x="374" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Last Name</text>
<text x="374" y="151" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Hire Date</text>
<text x="374" y="170" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Salary</text>
<text x="374" y="189" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">o Commission</text>
<rect x="710" y="50" width="160" height="120" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="790.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">JOB</text>
<text x="724" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Job ID</text>
<text x="724" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Title</text>
<text x="724" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Max Salary</text>
<text x="724" y="151" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Min Salary</text>
<path d="M360 100 L222 100" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M210 100 L224 94 L224 106 Z" style="fill:var(--dg-line, var(--text-soft));stroke:none"/>
<path d="M560 100 L698 100" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M710 100 L696 94 L696 106 Z" style="fill:var(--dg-line, var(--text-soft));stroke:none"/>
<text x="285" y="92" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">WORKS IN</text>
<text x="635" y="92" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">HOLDS</text>
<g class="en"><text x="285" y="124" text-anchor="middle" style="fill:var(--dg-bad, var(--text));font-family:var(--font, sans-serif);font-size:11.5px">one name, capitals</text></g><g class="ar"><text x="285" y="124" text-anchor="middle" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-bad, var(--text));font-family:var(--font-ar, sans-serif);font-size:12.5px">اسم واحد، أحرف كبيرة</text></g>
<g class="en"><text x="635" y="124" text-anchor="middle" style="fill:var(--dg-bad, var(--text));font-family:var(--font, sans-serif);font-size:11.5px">arrowhead, no ends</text></g><g class="ar"><text x="635" y="124" text-anchor="middle" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-bad, var(--text));font-family:var(--font-ar, sans-serif);font-size:12.5px">رأس سهم، بلا أطراف</text></g>
<rect x="30" y="228" width="840" height="76" rx="6" style="fill:var(--dg-bad-soft, var(--surface));stroke:var(--dg-bad, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="46" y="251" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Capitals make WORKS IN look like an entity. Read from DEPARTMENT, the line has no name at all.</text></g><g class="ar"><text x="854" y="251" text-anchor="start" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">الأحرف الكبيرة تجعل WORKS IN تبدو كيانًا. ومن جهة DEPARTMENT لا اسم للخط أصلًا.</text></g>
<g class="en"><text x="46" y="271" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">An arrow is not an ERD mark: nothing says must or may, one or more.</text></g><g class="ar"><text x="854" y="271" text-anchor="start" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">السهم ليس علامة في مخطّط ERD: لا شيء يقول «يجب» أو «قد»، ولا «واحد» أو «أكثر».</text></g>
<g class="en"><text x="46" y="291" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Must every employee have a department? May a job be vacant? The picture is silent.</text></g><g class="ar"><text x="854" y="291" text-anchor="start" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">هل يجب أن يكون لكل موظّف قسم؟ وهل يجوز أن تكون الوظيفة شاغرة؟ الصورة صامتة.</text></g>
</svg>
