<g class="en"><text x="56" y="401" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Each grade needs a STUDENT and a SUBJECT to mean anything: five grades, five pairs.</text></g><g class="ar"><text x="724" y="401" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‏كل درجة تحتاج إلى STUDENT وSUBJECT معًا لتعني شيئًا: خمس درجات، خمسة أزواج.</text></g>
<g class="en"><text x="56" y="420" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">The M:M relationship is hiding an attribute. No box holds it yet — Lesson 5 gives it one.</text></g><g class="ar"><text x="724" y="420" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏علاقة ‎M:M تخفي خاصية. ولا يحملها أيّ صندوق بعد — والدرس 5 يعطيها صندوقًا.</text></g>
<g class="en"><text x="56" y="439" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">The dotted note is a sketch, not Oracle notation: attributes never sit on a line.</text></g><g class="ar"><text x="724" y="439" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏الملاحظة المنقّطة رسم توضيحي لا ترميز Oracle: فالخصائص لا توضع على الخط أبدًا.</text></g></svg>
