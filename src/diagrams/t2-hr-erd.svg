<g class="en"><text x="46" y="492" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Dashed lines, single toes and crow’s feet record optionality and cardinality — chapter T3 teaches you to read them.</text></g><g class="ar"><text x="964" y="492" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">الخطوط المتقطّعة والطرف المفرد وقدم الغراب تسجّل الإلزامية والعدد — ويعلّمك الفصل T3 قراءتها.</text></g>
