<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" direction="ltr" role="img" aria-labelledby="t4-pay-inherit-t">
<title id="t4-pay-inherit-t">What one CREDIT CARD has: the ID, date and amount inherited from PAYMENT, plus its own Card Number and its own relationship to CUSTOMER / ما تملكه دفعة CREDIT CARD الواحدة: الرقم والتاريخ والمبلغ موروثة من PAYMENT، مع رقم البطاقة الخاصّ بها وعلاقتها الخاصّة مع CUSTOMER</title>
<g class="en"><text x="400.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Inheritance — what a CREDIT CARD really has</text></g><g class="ar"><text x="400.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">الوراثة — ما تملكه CREDIT CARD حقًّا</text></g>
<rect x="40" y="50" width="260" height="266" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="170.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">PAYMENT</text>
<text x="54" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># Payment ID</text>
<text x="54" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Payment Date</text>
<text x="54" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Amount</text>
<rect x="60" y="153" width="220" height="30" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="170.0" y="175" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CASH</text>
<rect x="60" y="195" width="220" height="30" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="170.0" y="217" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CHECK</text>
<rect x="60" y="237" width="220" height="59" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-good, var(--accent));stroke-width:2.6"/>
<text x="170.0" y="259" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CREDIT CARD</text>
<text x="74" y="281" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Card Number</text>
<path d="M282 266 L380 170" style="stroke:var(--dg-good, var(--text-soft));stroke-width:1.4;fill:none;stroke-dasharray:3 3"/>
<path d="M380 170 L369 172 L376 179 Z" style="fill:var(--dg-good, var(--text-soft))"/>
<rect x="390" y="50" width="370" height="200" rx="6" style="fill:var(--dg-block-fill, var(--surface-2));stroke:var(--dg-block-stroke, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="406" y="74" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px;font-weight:700">Every CREDIT CARD has …</text></g><g class="ar"><text x="744" y="74" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px;font-weight:700">كل CREDIT CARD لها …</text></g>
<text x="406" y="102" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># Payment ID</text>
<g class="en"><text x="744" y="102" text-anchor="end" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">inherited from PAYMENT</text></g><g class="ar"><text x="744" y="102" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">موروثة من PAYMENT</text></g>
<text x="406" y="130" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Payment Date</text>
<g class="en"><text x="744" y="130" text-anchor="end" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">inherited from PAYMENT</text></g><g class="ar"><text x="744" y="130" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">موروثة من PAYMENT</text></g>
<text x="406" y="158" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Amount</text>
<g class="en"><text x="744" y="158" text-anchor="end" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">inherited from PAYMENT</text></g><g class="ar"><text x="744" y="158" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">موروثة من PAYMENT</text></g>
<path d="M402 168 L748 168" style="stroke:var(--dg-block-stroke, var(--text-soft));stroke-width:1;fill:none;stroke-dasharray:4 3"/>
<text x="406" y="186" text-anchor="start" style="fill:var(--dg-good, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Card Number</text>
<g class="en"><text x="744" y="186" text-anchor="end" style="fill:var(--dg-good, var(--text));font-family:var(--font, sans-serif);font-size:12px">its own attribute</text></g><g class="ar"><text x="744" y="186" text-anchor="start" direction="rtl" style="fill:var(--dg-good, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">خاصيتها الخاصّة</text></g>
<text x="406" y="214" text-anchor="start" style="fill:var(--dg-good, var(--text));font-family:var(--mono, monospace);font-size:12.5px">made by CUSTOMER</text>
<g class="en"><text x="744" y="214" text-anchor="end" style="fill:var(--dg-good, var(--text));font-family:var(--font, sans-serif);font-size:12px">its own relationship</text></g><g class="ar"><text x="744" y="214" text-anchor="start" direction="rtl" style="fill:var(--dg-good, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">علاقتها الخاصّة</text></g>
<rect x="40" y="336" width="720" height="76" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="359" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Payment 3 is one instance of CREDIT CARD. All five values belong to it:</text></g><g class="ar"><text x="744" y="359" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">الدفعة 3 نسخةٌ واحدة من CREDIT CARD، والقيم الخمس كلها تخصّها:</text></g>
<text x="56" y="389" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px">3 · 2026-03-03 · 310 · 4111 1111 1111 1111 · made by Omar</text>
</svg>
