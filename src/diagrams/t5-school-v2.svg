<g class="en"><text x="46" y="211" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Fixed: STUDENT–STUDY GROUP is transferable (no diamond); RECEIPT–STUDENT stays nontransferable.</text></g><g class="ar"><text x="854" y="211" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‏أُصلح: STUDENT–STUDY GROUP قابلة للنقل (بلا معيَّن)، وRECEIPT–STUDENT تبقى غير قابلة للنقل.</text></g>
<g class="en"><text x="46" y="230" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Each line answers its own question. This is the recommended model.</text></g><g class="ar"><text x="854" y="230" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏كل خط يجيب عن سؤاله الخاص. وهذا هو النموذج الموصى به.</text></g></svg>
