<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 256" direction="ltr" role="img" aria-labelledby="t5-school-v2-t">
<title id="t5-school-v2-t">Version 2: STUDY GROUP have / join STUDENT with no diamond, STUDENT issued / issued to RECEIPT with a diamond / الإصدار 2: STUDY GROUP have / join STUDENT بلا معيَّن، وSTUDENT issued / issued to RECEIPT مع معيَّن</title>
<g class="en"><text x="450" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 2 — a diamond only where the business says so</text></g><g class="ar"><text x="450" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">‏الإصدار 2 — معيَّن حيث يقول العمل فقط</text></g>
