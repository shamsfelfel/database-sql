<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 352" direction="ltr" role="img" aria-labelledby="t3-matrix-order-t">
<title id="t3-matrix-order-t">The relationship matrix for CUSTOMER, ITEM, ORDER and WAREHOUSE: six names in sixteen cells, giving three relationships / مصفوفة العلاقات لـ CUSTOMER وITEM وORDER وWAREHOUSE: ستة أسماء في ست عشرة خلية، تعطي ثلاث علاقات</title>
<g class="en"><text x="390.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Four entities, sixteen cells, three relationships</text></g><g class="ar"><text x="390.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">أربعة كيانات، ست عشرة خلية، ثلاث علاقات</text></g>
<rect x="40" y="44" width="140" height="40" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-line, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="110.0" y="61" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:10.5px">row ↓  column →</text></g><g class="ar"><text x="110.0" y="61" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:11.5px">الصف ↓  العمود ←</text></g>
<g class="en"><text x="110.0" y="76" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:10px">(read row first)</text></g><g class="ar"><text x="110.0" y="76" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:11px">(الصف يُقرأ أوّلًا)</text></g>
