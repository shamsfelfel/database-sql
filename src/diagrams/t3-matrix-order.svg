<rect x="460" y="204" width="140" height="40" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-line, var(--text-soft));stroke-width:1"/>
<rect x="600" y="204" width="140" height="40" style="fill:var(--dg-line, var(--text-soft));fill-opacity:0.2;stroke:var(--dg-line, var(--text-soft));stroke-width:1"/>
<text x="670.0" y="229" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--mono, monospace);font-size:14px">·</text>
<rect x="40" y="266" width="700" height="70" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="288" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:11.5px">Six filled cells make three pairs: CUSTOMER–ORDER, ITEM–ORDER, ITEM–WAREHOUSE.</text></g><g class="ar"><text x="724" y="288" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:12.5px">ست خلايا مملوءة تصنع ثلاثة أزواج: CUSTOMER–ORDER وITEM–ORDER وITEM–WAREHOUSE.</text></g>
<g class="en"><text x="56" y="310" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11px">The empty pairs are decisions too: no CUSTOMER–WAREHOUSE line, no CUSTOMER–ITEM line.</text></g><g class="ar"><text x="724" y="310" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12px">والأزواج الفارغة قرارات أيضًا: لا خط بين CUSTOMER وWAREHOUSE، ولا خط بين CUSTOMER وITEM.</text></g>
