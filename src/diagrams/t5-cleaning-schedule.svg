<g class="en"><text x="36" y="340" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Same recipe, third time: the M:M line goes; a new box sits between; both crow's feet point at it.</text></g><g class="ar"><text x="824" y="340" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‏الوصفة نفسها للمرة الثالثة: يذهب خط ‎M:M، ويقعد صندوق جديد بين الكيانين، وتشير إليه رِجلا الغراب.</text></g>
<g class="en"><text x="36" y="359" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Each CLEANING SCHEDULE must be for one and only one CLEANING COMPANY and one CLEANING SERVICE.</text></g><g class="ar"><text x="824" y="359" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏كل CLEANING SCHEDULE يجب أن يكون لـ CLEANING COMPANY واحدة فقط ولـ CLEANING SERVICE واحدة فقط.</text></g>
<g class="en"><text x="36" y="378" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Start Date and Price are one value per company per service (Lesson 4), so they live here.</text></g><g class="ar"><text x="824" y="378" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏Start Date وPrice قيمة واحدة لكل شركة في كل خدمة (الدرس 4)، فتسكنان هنا.</text></g>
<g class="en"><text x="36" y="397" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">The slides name the box and its lines; the two attributes are this lesson's illustration.</text></g><g class="ar"><text x="824" y="397" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏تسمّي الشرائح الصندوق وخطّيه؛ أمّا الخاصيتان فتوضيح من هذا الدرس.</text></g>
