<g class="en"><text x="56" y="286" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Each EMPLOYEE may be managed by one and only one EMPLOYEE.</text></g><g class="ar"><text x="784" y="286" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">قد يُدار كل EMPLOYEE من قِبل EMPLOYEE واحد فقط لا غير.</text></g>
<g class="en"><text x="56" y="308" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Each EMPLOYEE may be the manager of one or more EMPLOYEEs. Dana is stored once.</text></g><g class="ar"><text x="784" y="308" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">وقد يكون كل EMPLOYEE مديرًا لـ EMPLOYEE واحد أو أكثر. وDana مخزّنة مرّة واحدة.</text></g>
