<text x="470" y="84" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px;font-weight:700">?</text>
<path d="M380 104 L520 104" style="stroke:none"/>
<g class="en"><text x="520" y="160" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:10.5px">single toe: one and only one</text></g><g class="ar"><text x="520" y="160" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:11.5px">إصبع واحدة: واحد فقط لا غير</text></g>
