<text x="175.5" y="196" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px;font-weight:700">2 EMPLOYEE</text>
<g class="en"><text x="175.5" y="213" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:10px">entity A</text></g><g class="ar"><text x="175.5" y="213" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:11px">الكيان A</text></g>
<rect x="241.0" y="178" width="80" height="44" rx="5" style="fill:var(--dg-row-odd, var(--surface));stroke:var(--dg-line, var(--text-soft));stroke-width:1"/>
<text x="281.0" y="196" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px;font-weight:700">3 MUST</text>
<g class="en"><text x="281.0" y="213" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:10px">solid half</text></g><g class="ar"><text x="281.0" y="213" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:11px">نصف متّصل</text></g>
<rect x="334.0" y="178" width="95" height="44" rx="5" style="fill:var(--dg-row-odd, var(--surface));stroke:var(--dg-line, var(--text-soft));stroke-width:1"/>
<text x="381.5" y="196" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px;font-weight:700">4 WORK IN</text>
<g class="en"><text x="381.5" y="213" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:10px">name at A</text></g><g class="ar"><text x="381.5" y="213" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:11px">الاسم عند A</text></g>
<rect x="442.0" y="178" width="150" height="44" rx="5" style="fill:var(--dg-row-odd, var(--surface));stroke:var(--dg-line, var(--text-soft));stroke-width:1"/>
<text x="517.0" y="196" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px;font-weight:700">5 ONE AND ONLY ONE</text>
<g class="en"><text x="517.0" y="213" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:10px">toe at B</text></g><g class="ar"><text x="517.0" y="213" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:11px">إصبع عند B</text></g>
<rect x="605.0" y="178" width="115" height="44" rx="5" style="fill:var(--dg-row-odd, var(--surface));stroke:var(--dg-line, var(--text-soft));stroke-width:1"/>
<text x="662.5" y="196" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px;font-weight:700">6 DEPARTMENT</text>
<g class="en"><text x="662.5" y="213" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:10px">entity B</text></g><g class="ar"><text x="662.5" y="213" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:11px">الكيان B</text></g>
<rect x="40" y="238" width="680" height="76" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<text x="56" y="260" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each EMPLOYEE must work in one and only one DEPARTMENT.</text>
<g class="en"><text x="56" y="284" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Fixed: the EMPLOYEE half, its name, the end at DEPARTMENT.</text></g><g class="ar"><text x="704" y="284" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">حُسم: نصف EMPLOYEE، واسمه، والطرف عند DEPARTMENT.</text></g>
<g class="en"><text x="56" y="304" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Still unknown: the DEPARTMENT half, its name, the end at EMPLOYEE.</text></g><g class="ar"><text x="704" y="304" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">وما زال مجهولًا: نصف DEPARTMENT، واسمه، والطرف عند EMPLOYEE.</text></g>
</svg>
