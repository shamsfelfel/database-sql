<text x="75.0" y="196" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px;font-weight:700">1 EACH</text>
<g class="en"><text x="75.0" y="213" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:10px">each</text></g><g class="ar"><text x="75.0" y="213" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:11px">كل</text></g>
