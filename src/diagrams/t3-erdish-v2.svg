<path d="M380 104 L520 104" style="stroke:var(--dg-warn, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:1 4"/>
<text x="262" y="92" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">work in</text>
