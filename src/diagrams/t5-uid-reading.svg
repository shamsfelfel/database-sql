<g class="en"><text x="36" y="387" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Read the parts in the order you met them: the box first, then each bar to its parent's #.</text></g><g class="ar"><text x="824" y="387" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏اقرأ الأجزاء بالترتيب الذي تلقاها به: الصندوق أوّلًا، ثم كل قضيب إلى خاصية ‎#‎ في أبيه.</text></g>
