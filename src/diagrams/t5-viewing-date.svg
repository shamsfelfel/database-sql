<rect x="20" y="184" width="820" height="79" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="36" y="206" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">UID = TV SHOW + PERSON + Date Watched: two parts from the bars, one from inside the box.</text></g><g class="ar"><text x="824" y="206" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‏المعرّف = TV SHOW + PERSON + Date Watched: جزءان من القضيبين، وجزء من داخل الصندوق.</text></g>
<g class="en"><text x="36" y="225" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Huda's two viewings of News differ by date, so both are kept. The same viewing twice is still refused.</text></g><g class="ar"><text x="824" y="225" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏مشاهدتا Huda لبرنامج News تختلفان في التاريخ، فتُحفظان كلتاهما. والمشاهدة نفسها مرّتين ما زالت تُرفض.</text></g>
<g class="en"><text x="36" y="244" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">This is why the slides say the UID often — not always — comes from the relationships.</text></g><g class="ar"><text x="824" y="244" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏ولهذا تقول الشرائح إن المعرّف يأتي غالبًا — لا دائمًا — من العلاقات.</text></g>
</svg>
