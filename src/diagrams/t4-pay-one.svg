<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 372" direction="ltr" role="img" aria-labelledby="t4-pay-one-t">
<title id="t4-pay-one-t">Version 2: one PAYMENT entity with a Method attribute, an optional Card Number, and a relationship to CUSTOMER that is dashed at both halves / الإصدار 2: كيان PAYMENT واحد بخاصية Method، ورقم بطاقة اختياري، وعلاقة مع CUSTOMER متقطّعة في نصفيها</title>
<g class="en"><text x="390.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 2 — one entity, every extra made optional</text></g><g class="ar"><text x="390.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">الإصدار 2 — كيان واحد، وكل إضافة اختيارية</text></g>
<rect x="40" y="50" width="240" height="135" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="160.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">PAYMENT</text>
<text x="54" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># Payment ID</text>
<text x="54" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Payment Date</text>
<text x="54" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Amount</text>
<text x="54" y="151" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Method</text>
<text x="54" y="170" text-anchor="start" style="fill:var(--dg-bad, var(--text));font-family:var(--mono, monospace);font-size:12.5px">o Card Number</text>
<rect x="520" y="70" width="220" height="78" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="630.0" y="92" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CUSTOMER</text>
<text x="534" y="114" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># Customer ID</text>
<text x="534" y="133" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Name</text>
<path d="M280 112 L400.0 112" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M400.0 112 L520 112" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M294 112 L280 104" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M294 112 L280 112" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M294 112 L280 120" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="300" y="104" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">made by</text>
<text x="512" y="130" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">make</text>
<g class="en"><text x="340" y="150" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11px">dashed: may</text></g><g class="ar"><text x="340" y="150" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12px">متقطّع: قد</text></g>
<g class="en"><text x="460" y="150" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11px">dashed: may</text></g><g class="ar"><text x="460" y="150" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12px">متقطّع: قد</text></g>
<rect x="40" y="200" width="700" height="56" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<text x="56" y="223" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each PAYMENT may be made by one and only one CUSTOMER.</text>
<text x="56" y="244" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each CUSTOMER may make one or more PAYMENTs.</text>
<rect x="40" y="268" width="700" height="92" rx="6" style="fill:var(--dg-bad-soft, var(--surface));stroke:var(--dg-bad, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="291" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Stores everything: Method says which kind a payment is, Card Number and CUSTOMER are there when needed.</text></g><g class="ar"><text x="724" y="291" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">يحفظ كل شيء: Method تقول ما نوع الدفعة، ورقم البطاقة وCUSTOMER موجودان عند الحاجة.</text></g>
<g class="en"><text x="56" y="311" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Defect: hidden rules. o Card Number lets a card payment have none; the dashed PAYMENT half</text></g><g class="ar"><text x="724" y="311" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">العيب: قواعد مخفيّة. رقم البطاقة الاختياري يسمح بدفعة بطاقة بلا رقم، والنصف المتقطّع عند PAYMENT</text></g>
<g class="en"><text x="56" y="331" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">lets a cheque have no customer. 'Card number only for cards' is written nowhere.</text></g><g class="ar"><text x="724" y="331" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">يسمح بشيك بلا زبون. و«رقم البطاقة للبطاقات فقط» غير مكتوب في أيّ مكان.</text></g>
</svg>
