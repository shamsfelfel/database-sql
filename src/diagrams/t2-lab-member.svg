<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" direction="ltr" role="img" aria-labelledby="t2-lab-member-t">
<title id="t2-lab-member-t">MEMBER as an entity and as the members table: five * attributes become NOT NULL, o State stays nullable / MEMBER كيانًا وجدول members: خمس خصائص * تصبح NOT NULL، وتبقى o State قابلة لـ null</title>
<defs><marker id="t2-lab-member-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--dg-line, var(--text-soft))"/></marker></defs>
<g class="en"><text x="410" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:14px;font-weight:600">MEMBER becomes members</text></g><g class="ar"><text x="410" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:15px;font-weight:600">MEMBER يصير members</text></g>
<g class="en"><text x="130" y="56" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">ERD (logical model)</text></g><g class="ar"><text x="130" y="56" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">المخطّط (النموذج المنطقي)</text></g>
<g class="en"><text x="585" y="56" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Table (physical model, Oracle)</text></g><g class="ar"><text x="585" y="56" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">الجدول (النموذج الفيزيائي، Oracle)</text></g>
<rect x="30" y="70" width="200" height="224" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="130" y="91" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">MEMBER</text>
