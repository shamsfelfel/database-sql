<g class="en"><text x="410" y="324" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px">o adds nothing: state is left nullable, so a member may have no state</text></g><g class="ar"><text x="410" y="324" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px">العلامة o لا تضيف شيئًا: يبقى state قابلًا لـ null، فقد لا تكون للعضو ولاية</text></g>
