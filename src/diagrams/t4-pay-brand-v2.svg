<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" direction="ltr" role="img" aria-labelledby="t4-pay-brand-v2-t">
<title id="t4-pay-brand-v2-t">Version 2: the card brands removed as boxes; CARD gains a mandatory Card Brand attribute and the hierarchy stays at two levels / الإصدار 2: أُزيلت علامات البطاقات صناديقَ؛ واكتسب CARD خاصية Card Brand الإلزامية، وبقي التسلسل في مستويين</title>
<g class="en"><text x="400.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 2 — two levels, and the brand is an attribute of CARD</text></g><g class="ar"><text x="400.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">الإصدار 2 — مستويان، والعلامة خاصيةٌ في CARD</text></g>
<rect x="40" y="50" width="470" height="396" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="275.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">PAYMENT</text>
<text x="54" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># Payment ID</text>
<text x="54" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Payment Date</text>
<text x="54" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Amount</text>
<rect x="60" y="153" width="205" height="30" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="162.5" y="175" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CASH</text>
<rect x="285" y="153" width="205" height="30" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="387.5" y="175" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CHECK</text>
<rect x="60" y="195" width="430" height="189" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="275.0" y="217" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CARD</text>
<text x="74" y="239" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Card Number</text>
<text x="74" y="258" text-anchor="start" style="fill:var(--dg-good, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Card Brand</text>
<rect x="78" y="270" width="394" height="46" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.2"/>
<text x="275.0" y="292" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CREDIT CARD</text>
<text x="92" y="314" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Instalments</text>
<rect x="78" y="324" width="394" height="46" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.2"/>
<text x="275.0" y="346" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">DEBIT CARD</text>
<text x="92" y="368" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">o Cashback Amount</text>
<rect x="60" y="396" width="430" height="30" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="275.0" y="418" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">OTHER</text>
<path d="M490 168 L554 168" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1;fill:none;stroke-dasharray:2 3"/>
<g class="en"><text x="560" y="172" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px;font-weight:600">level 1</text></g><g class="ar"><text x="560" y="172" text-anchor="end" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px;font-weight:600">المستوى 1</text></g>
<path d="M472 293 L554 293" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1;fill:none;stroke-dasharray:2 3"/>
<g class="en"><text x="560" y="297" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px;font-weight:600">level 2</text></g><g class="ar"><text x="560" y="297" text-anchor="end" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px;font-weight:600">المستوى 2</text></g>
<path d="M472 347 L554 347" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1;fill:none;stroke-dasharray:2 3"/>
<g class="en"><text x="560" y="351" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px;font-weight:600">level 2</text></g><g class="ar"><text x="560" y="351" text-anchor="end" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px;font-weight:600">المستوى 2</text></g>
<rect x="40" y="466" width="720" height="76" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="489" text-anchor="start" style="fill:var(--dg-good, var(--text));font-family:var(--font, sans-serif);font-size:12px">* Card Brand is written once, in CARD, so a Visa debit and a Visa credit share it.</text></g><g class="ar"><text x="744" y="489" text-anchor="start" direction="rtl" style="fill:var(--dg-good, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‎* Card Brand مكتوبة مرّة واحدة، في CARD، فيشترك فيها خصم Visa وائتمان Visa.</text></g>
<g class="en"><text x="56" y="509" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Its values are VISA, MASTERCARD or OTHER. A new brand is a new value, not a new box.</text></g><g class="ar"><text x="744" y="509" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">قيمها VISA أو MASTERCARD أو OTHER. والعلامة الجديدة قيمةٌ جديدة، لا صندوق جديد.</text></g>
<g class="en"><text x="56" y="529" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Two levels, every box earns its place, and the diagram is readable at a glance.</text></g><g class="ar"><text x="744" y="529" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">مستويان، وكل صندوق يستحقّ مكانه، والمخطّط يُقرأ بنظرة واحدة.</text></g>
</svg>
