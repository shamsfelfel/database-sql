<g class="en"><text x="100" y="140" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">the entity</text></g><g class="ar"><text x="100" y="140" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">الكيان</text></g>
<g class="en"><text x="580" y="140" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">four instances of FRUIT — and the list could go on</text></g><g class="ar"><text x="580" y="140" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">أربع نُسخ من FRUIT — والقائمة يمكن أن تطول</text></g>
<g class="en"><text x="100" y="260" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">the entity</text></g><g class="ar"><text x="100" y="260" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">الكيان</text></g>
<g class="en"><text x="580" y="260" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">four instances of BOOK — one per book the library owns</text></g><g class="ar"><text x="580" y="260" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">أربع نُسخ من BOOK — واحدة لكل كتاب تملكه المكتبة</text></g>
<g class="en"><text x="480" y="304" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">softbox = entity (what an ERD draws) · plain card = instance (shown here only to explain)</text></g><g class="ar"><text x="480" y="304" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">الصندوق المستدير = كيان، وهو ما يُرسم في الـ ERD فعلًا · البطاقة = نسخة، تظهر هنا للشرح فقط</text></g>
</svg>
