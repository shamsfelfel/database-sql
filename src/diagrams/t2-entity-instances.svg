<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" direction="ltr" role="img" aria-labelledby="t2-entity-instances-t">
<title id="t2-entity-instances-t">Two entities, FRUIT and BOOK, each with four instances / كيانان، FRUIT وBOOK، لكلٍّ منهما أربع نُسخ</title>
<g class="en"><text x="480" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">An entity is the set; an instance is one member of it</text></g><g class="ar"><text x="480" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">الكيان هو المجموعة، والنسخة واحدةٌ منها</text></g>
<rect x="30" y="62" width="140" height="56" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/><text x="100.0" y="95.0" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">FRUIT</text>
