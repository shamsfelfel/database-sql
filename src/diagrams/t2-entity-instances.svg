<rect x="200" y="194" width="150" height="32" rx="3" style="fill:var(--dg-alt-fill, var(--surface-2));stroke:var(--dg-alt-stroke, var(--text-soft));stroke-width:1"/><text x="275.0" y="214.5" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">A Vision</text>
