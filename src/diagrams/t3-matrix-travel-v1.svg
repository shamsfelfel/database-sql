<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" direction="ltr" role="img" aria-labelledby="t3-matrix-travel-v1-t">
<title id="t3-matrix-travel-v1-t">Version 1: the travel agency ERD drawn from the scenario without a matrix: TRAVELER and COUNTRY joined, LANDMARK left with no relationship / الإصدار 1: مخطّط وكالة السفر مرسومًا من السيناريو بلا مصفوفة: TRAVELER وCOUNTRY مرتبطان، وLANDMARK بلا أيّ علاقة</title>
<g class="en"><text x="390.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 1 — drawn from the scenario alone</text></g><g class="ar"><text x="390.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">الإصدار 1 — مرسوم من السيناريو وحده</text></g>
<rect x="40" y="50" width="200" height="250" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="140" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">TRAVELER</text>
<text x="54" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Traveler ID</text>
<text x="54" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Name</text>
<rect x="540" y="50" width="200" height="78" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="640.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">COUNTRY</text>
<text x="554" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Country Code</text>
<text x="554" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Name</text>
<rect x="540" y="224" width="200" height="78" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-warn, var(--accent));stroke-width:1.5"/>
<text x="640.0" y="246" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">LANDMARK</text>
<text x="554" y="268" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Landmark ID</text>
<text x="554" y="287" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Name</text>
<path d="M240 104 L390 104" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M390 104 L540 104" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M254 104 L240 96" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M254 104 L240 104" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M254 104 L240 112" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M526 104 L540 96" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M526 104 L540 104" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M526 104 L540 112" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="262" y="95" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">visit</text>
<text x="532" y="122" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">visited by</text>
<rect x="40" y="324" width="700" height="88" rx="6" style="fill:var(--dg-warn-soft, var(--surface));stroke:var(--dg-warn, var(--text-soft));stroke-width:1"/>
<text x="56" y="346" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each TRAVELER may visit one or more COUNTRYs.</text>
<text x="56" y="365" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each COUNTRY may be visited by one or more TRAVELERs.</text>
<g class="en"><text x="56" y="388" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:11.5px">LANDMARK has no line: no ERD sentence can say which country Petra is in,</text></g><g class="ar"><text x="724" y="388" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:12.5px">لا خط لـ LANDMARK: لا تستطيع أيّ جملة أن تقول في أيّ بلد تقع البتراء،</text></g>
<g class="en"><text x="56" y="404" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:11.5px">or who has seen it — the very thing the agency said it keeps.</text></g><g class="ar"><text x="724" y="404" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:12.5px">ولا من رآها — وهذا بالضبط ما قالت الوكالة إنها تحتفظ به.</text></g>
</svg>
