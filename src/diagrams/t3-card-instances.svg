<g class="en"><text x="470" y="162" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">How many JOBs can one EMPLOYEE hold?</text></g><g class="ar"><text x="870" y="162" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">كم وظيفة يستطيع الموظّف الواحد أن يشغل؟</text></g>
<g class="en"><text x="470" y="182" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">One only → singular → single toe at JOB</text></g><g class="ar"><text x="870" y="182" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">واحدة فقط ← مفرد ← إصبع واحدة عند JOB</text></g>
<g class="en"><text x="470" y="214" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">How many EMPLOYEEs can hold one JOB?</text></g><g class="ar"><text x="870" y="214" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">كم موظّفًا يستطيع أن يشغل الوظيفة الواحدة؟</text></g>
<g class="en"><text x="470" y="234" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">More than one → plural → crow's foot at EMPLOYEE</text></g><g class="ar"><text x="870" y="234" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">أكثر من واحد ← جمع ← قدم غراب عند EMPLOYEE</text></g>
<rect x="40" y="330" width="830" height="56" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="352" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Every employee sends out exactly one line; SA_REP receives two. That difference is the whole of cardinality.</text></g><g class="ar"><text x="854" y="352" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">كل موظّف يخرج منه خط واحد بالضبط، وSA_REP يصل إليه خطّان. وهذا الفرق هو التعدّدية كلّها.</text></g>
<g class="en"><text x="56" y="372" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">The answer is one or more-than-one. Nobody asks whether it is two, or fifty.</text></g><g class="ar"><text x="854" y="372" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">الجواب: واحد أم أكثر من واحد. ولا يسأل أحد هل هو اثنان أم خمسون.</text></g>
</svg>
