<title id="t3-card-instances-t">How many? Six employees each hold exactly one job; the Sales Representative job is held by two employees and Stock Clerk by none, so the JOB end is singular and the EMPLOYEE end plural / كم؟ كل موظّف من الستّة يشغل وظيفة واحدة بالضبط، ووظيفة مندوب المبيعات يشغلها موظّفان وأمين المخزن لا أحد، فطرف JOB مفرد وطرف EMPLOYEE جمع</title>
