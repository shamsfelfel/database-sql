<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 414" direction="ltr" role="img" aria-labelledby="t4-snow-sport-t">
<title id="t4-snow-sport-t">The lecturer's SNOW SPORT supertype with SKI, SNOWBOARD, CROSS COUNTRY and OTHER, checked against the three questions / النوع الأعلى SNOW SPORT للمحاضِرة، وفيه SKI وSNOWBOARD وCROSS COUNTRY وOTHER، مفحوصًا بالأسئلة الثلاثة</title>
<g class="en"><text x="400.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">SNOW SPORT, checked against the three questions</text></g><g class="ar"><text x="400.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">SNOW SPORT، مفحوصًا بالأسئلة الثلاثة</text></g>
<rect x="40" y="50" width="280" height="254" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="180.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">SNOW SPORT</text>
<text x="54" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># Sport ID</text>
<text x="54" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Name</text>
<rect x="60" y="128" width="240" height="30" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="180.0" y="149" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">SKI</text>
<rect x="60" y="170" width="240" height="30" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="180.0" y="191" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">SNOWBOARD</text>
<rect x="60" y="212" width="240" height="30" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="180.0" y="233" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CROSS COUNTRY</text>
<rect x="60" y="254" width="240" height="30" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="180.0" y="275" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">OTHER</text>
<rect x="360" y="50" width="400" height="78" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:2"/>
<g class="en"><text x="374" y="76" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px;font-weight:600">1  Is each subtype a kind of SNOW SPORT?</text></g><g class="ar"><text x="746" y="76" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px;font-weight:600">١  هل كل نوع فرعي نوعٌ من SNOW SPORT؟</text></g>
<g class="en"><text x="374" y="102" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Yes: a ski sport is a snow sport, and so on.</text></g><g class="ar"><text x="746" y="102" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">نعم: رياضة التزلّج رياضةٌ ثلجية، وهكذا البقية.</text></g>
<rect x="360" y="142" width="400" height="78" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:2"/>
<g class="en"><text x="374" y="168" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px;font-weight:600">2  Have I covered all possible cases? (exhaustive)</text></g><g class="ar"><text x="746" y="168" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px;font-weight:600">٢  هل غطّيت كل الحالات الممكنة؟ (الشمول)</text></g>
<g class="en"><text x="374" y="194" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Yes: any sport not named goes to OTHER.</text></g><g class="ar"><text x="746" y="194" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">نعم: أي رياضة غير مسمّاة تذهب إلى OTHER.</text></g>
<rect x="360" y="234" width="400" height="78" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:2"/>
<g class="en"><text x="374" y="260" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px;font-weight:600">3  Does each instance fit one and only one? (exclusive)</text></g><g class="ar"><text x="746" y="260" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px;font-weight:600">٣  هل تقع كل نسخة في نوع واحد فقط؟ (التنافي)</text></g>
<g class="en"><text x="374" y="286" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Yes: each sport is placed in exactly one box.</text></g><g class="ar"><text x="746" y="286" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">نعم: كل رياضة توضع في صندوق واحد بالضبط.</text></g>
<rect x="40" y="332" width="720" height="62" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="355" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">All three answers are yes, so the subtypes are correctly identified.</text></g><g class="ar"><text x="744" y="355" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">الأجوبة الثلاثة «نعم»، فالأنواع الفرعية محدّدة تحديدًا صحيحًا.</text></g>
<g class="en"><text x="56" y="375" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Read outwards-in: every SNOW SPORT is a SKI, a SNOWBOARD, a CROSS COUNTRY or an OTHER.</text></g><g class="ar"><text x="744" y="375" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">واقرأه من الخارج إلى الداخل: كل SNOW SPORT هو SKI أو SNOWBOARD أو CROSS COUNTRY أو OTHER.</text></g>
</svg>
