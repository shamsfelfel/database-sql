<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" direction="ltr" role="img" aria-labelledby="t2-attribute-roles-t">
<title id="t2-attribute-roles-t">An attribute describes, quantifies, qualifies, classifies or specifies an entity: BOOK's five attributes and one book's values / الخاصية تصف الكيان أو تكمّمه أو تقيّمه أو تصنّفه أو تحدّده: خمس خصائص للكيان BOOK وقيم كتاب واحد</title>
<g class="en"><text x="450" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Five jobs an attribute can do for BOOK</text></g><g class="ar"><text x="450" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">خمس وظائف تؤدّيها الخاصية للكيان BOOK</text></g>
<rect x="40" y="60" width="230" height="135" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.4"/>
<text x="155.0" y="82" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">BOOK</text>
<text x="54" y="104" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Title</text>
<text x="54" y="123" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">o Page Count</text>
<text x="54" y="142" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Condition</text>
<text x="54" y="161" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">o Genre</text>
<text x="54" y="180" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">o Edition</text>
<g class="en"><text x="560" y="58" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11.5px;font-weight:600">what it does</text></g><g class="ar"><text x="560" y="58" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12.5px;font-weight:600">ما تفعله</text></g>
<g class="en"><text x="800" y="58" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11.5px;font-weight:600">one value</text></g><g class="ar"><text x="800" y="58" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12.5px;font-weight:600">قيمة واحدة</text></g>
<path d="M276 100 L420 100" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.1;fill:none;stroke-dasharray:2 3"/>
<g class="en"><text x="430" y="104" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">describes — what is it?</text></g><g class="ar"><text x="430" y="104" text-anchor="end" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">تَصِف — ما هو؟</text></g>
<path d="M700 100 L735 100" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.1;fill:none;stroke-dasharray:2 3"/>
<text x="745" y="104" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">War and Peace</text>
<path d="M276 119 L420 119" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.1;fill:none;stroke-dasharray:2 3"/>
<g class="en"><text x="430" y="123" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">quantifies — how many?</text></g><g class="ar"><text x="430" y="123" text-anchor="end" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">تُكمِّم — كم؟</text></g>
<path d="M700 119 L735 119" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.1;fill:none;stroke-dasharray:2 3"/>
<text x="745" y="123" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">1225</text>
<path d="M276 138 L420 138" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.1;fill:none;stroke-dasharray:2 3"/>
<g class="en"><text x="430" y="142" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">qualifies — in what state?</text></g><g class="ar"><text x="430" y="142" text-anchor="end" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">تُقيِّم — في أيّ حال؟</text></g>
<path d="M700 138 L735 138" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.1;fill:none;stroke-dasharray:2 3"/>
<text x="745" y="142" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">worn</text>
<path d="M276 157 L420 157" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.1;fill:none;stroke-dasharray:2 3"/>
<g class="en"><text x="430" y="161" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">classifies — what kind?</text></g><g class="ar"><text x="430" y="161" text-anchor="end" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">تُصنِّف — من أيّ نوع؟</text></g>
<path d="M700 157 L735 157" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.1;fill:none;stroke-dasharray:2 3"/>
<text x="745" y="161" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">novel</text>
<path d="M276 176 L420 176" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.1;fill:none;stroke-dasharray:2 3"/>
<g class="en"><text x="430" y="180" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">specifies — exactly which?</text></g><g class="ar"><text x="430" y="180" text-anchor="end" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">تُحدِّد — أيّها بالضبط؟</text></g>
<path d="M700 176 L735 176" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.1;fill:none;stroke-dasharray:2 3"/>
<text x="745" y="180" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">2nd</text>
<rect x="40" y="230" width="820" height="50" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1.4"/>
<g class="en"><text x="450" y="260" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">The attribute is the question; the value is one instance’s answer: War and Peace, 1225 pages, worn, a novel, 2nd edition.</text></g><g class="ar"><text x="450" y="260" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">الخاصية هي السؤال، والقيمة جواب نسخة واحدة: War and Peace، و1225 صفحة، ومهترئ، ورواية، والطبعة الثانية.</text></g>
</svg>
