<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" direction="ltr" role="img" aria-labelledby="t3-conv-attrs-v1-t">
<title id="t3-conv-attrs-v1-t">Version 1: EMPLOYEE, DEPARTMENT and JOB with their attributes listed but unmarked - no #, no *, no o / الإصدار 1: EMPLOYEE وDEPARTMENT وJOB بخصائصها مُدرجةً بلا علامات - لا # ولا * ولا o</title>
<g class="en"><text x="450.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 1 — attributes listed, nothing marked</text></g><g class="ar"><text x="450.0" y="24" text-anchor="middle" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">الإصدار 1 — الخصائص مُدرجة، ولا شيء مُعلَّم</text></g>
<rect x="40" y="50" width="230" height="158" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="155.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">EMPLOYEE</text>
<text x="54" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">Employee ID</text>
<text x="54" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">First Name</text>
<text x="54" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">Last Name</text>
<text x="54" y="151" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">Hire Date</text>
<text x="54" y="170" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">Salary</text>
<text x="54" y="189" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">Commission</text>
<rect x="335" y="50" width="230" height="82" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="450.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">DEPARTMENT</text>
<text x="349" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">Department ID</text>
<text x="349" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">Name</text>
<rect x="630" y="50" width="230" height="120" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="745.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">JOB</text>
<text x="644" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">Job ID</text>
<text x="644" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">Title</text>
<text x="644" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">Max Salary</text>
<text x="644" y="151" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">Min Salary</text>
<g class="en"><text x="450" y="160" text-anchor="middle" style="fill:var(--dg-bad, var(--text));font-family:var(--font, sans-serif);font-size:11.5px">Which attribute identifies?</text></g><g class="ar"><text x="450" y="160" text-anchor="middle" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-bad, var(--text));font-family:var(--font-ar, sans-serif);font-size:12.5px">أيّ خاصية تُعرِّف؟</text></g>
<g class="en"><text x="450" y="180" text-anchor="middle" style="fill:var(--dg-bad, var(--text));font-family:var(--font, sans-serif);font-size:11.5px">Which may be left empty?</text></g><g class="ar"><text x="450" y="180" text-anchor="middle" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-bad, var(--text));font-family:var(--font-ar, sans-serif);font-size:12.5px">أيّها يجوز أن تبقى فارغة؟</text></g>
<rect x="40" y="228" width="820" height="76" rx="6" style="fill:var(--dg-bad-soft, var(--surface));stroke:var(--dg-bad, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="251" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">The box lists what is stored, but not which attribute is the UID or which values are required.</text></g><g class="ar"><text x="844" y="251" text-anchor="start" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">الصندوق يُدرج ما يُخزَّن، لكنه لا يقول أيّ خاصية هي المعرّف الفريد ولا أيّ القيم مطلوبة.</text></g>
<g class="en"><text x="56" y="271" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Dana Smith earns no commission. Can her row be saved? The diagram cannot answer.</text></g><g class="ar"><text x="844" y="271" text-anchor="start" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">لا تتقاضى Dana Smith عمولة. هل يمكن حفظ صفّها؟ المخطّط لا يستطيع أن يجيب.</text></g>
<g class="en"><text x="56" y="291" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">A builder who guesses "all required" refuses Dana; one who guesses "all optional" accepts a salary-less row.</text></g><g class="ar"><text x="844" y="291" text-anchor="start" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">من يخمّن «كلها مطلوبة» يرفض Dana، ومن يخمّن «كلها اختيارية» يقبل صفًّا بلا راتب.</text></g>
</svg>
