<path d="M292 342 L280 349" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="302" y="335" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">made by</text>
<text x="572" y="257" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">make</text>
<rect x="40" y="467" width="720" height="56" rx="6" style="fill:var(--dg-bad-soft, var(--surface));stroke:var(--dg-bad, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="490" text-anchor="start" style="fill:var(--dg-bad, var(--text));font-family:var(--font, sans-serif);font-size:12px">* Card Number is written twice, and a made by line is drawn for each kind of card.</text></g><g class="ar"><text x="744" y="490" text-anchor="start" direction="rtl" style="fill:var(--dg-bad, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‎* Card Number مكتوب مرّتين، وخطّ made by مرسوم لكل نوع من البطاقات.</text></g>
<g class="en"><text x="56" y="510" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">What the two cards share is said in two places, so a third kind of card would say it a third time.</text></g><g class="ar"><text x="744" y="510" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">ما تشترك فيه البطاقتان مقول في مكانين، فنوع ثالث من البطاقات سيقوله مرّة ثالثة.</text></g>
</svg>
