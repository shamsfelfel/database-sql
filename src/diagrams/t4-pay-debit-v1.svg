<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" direction="ltr" role="img" aria-labelledby="t4-pay-debit-v1-t">
<title id="t4-pay-debit-v1-t">Version 1: DEBIT CARD drawn as a fourth subtype of PAYMENT beside CREDIT CARD, repeating Card Number and the made by relationship to CUSTOMER / الإصدار 1: DEBIT CARD مرسومًا نوعًا فرعيًّا رابعًا لـ PAYMENT بجانب CREDIT CARD، يكرّر Card Number وعلاقة made by مع CUSTOMER</title>
<g class="en"><text x="400.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 1 — DEBIT CARD added beside CREDIT CARD</text></g><g class="ar"><text x="400.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">الإصدار 1 — DEBIT CARD مضافًا بجانب CREDIT CARD</text></g>
