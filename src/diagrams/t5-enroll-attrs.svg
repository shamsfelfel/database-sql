<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" direction="ltr" role="img" aria-labelledby="t5-enroll-attrs-t">
<title id="t5-enroll-attrs-t">STUDENT, ENROLLMENT and SUBJECT with every attribute in its home: Phone in STUDENT, Credit Hours in SUBJECT, Enrolment Date, Grade and Absences in ENROLLMENT / STUDENT وENROLLMENT وSUBJECT وكل خاصية في بيتها: Phone في STUDENT، وCredit Hours في SUBJECT، وEnrolment Date وGrade وAbsences في ENROLLMENT</title>
<g class="en"><text x="430.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Every attribute in its home</text></g><g class="ar"><text x="430.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">‏كل خاصية في بيتها</text></g>
<rect x="20" y="50" width="180" height="118" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="110.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">STUDENT</text>
