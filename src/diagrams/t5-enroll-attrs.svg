<path d="M590.0 95 L660 95" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M534 95 L520 87" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M534 95 L520 95" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M534 95 L520 103" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="540" y="85" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">for</text>
<text x="652" y="115" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">subject of</text>
<rect x="20" y="196" width="820" height="92" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="36" y="218" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">One value per student: STUDENT. One value per subject: SUBJECT.</text></g><g class="ar"><text x="824" y="218" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‏قيمة واحدة لكل طالب: STUDENT. وقيمة واحدة لكل مادة: SUBJECT.</text></g>
<g class="en"><text x="36" y="237" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">One value per student in a subject: ENROLLMENT — the pair test now has a box to point at.</text></g><g class="ar"><text x="824" y="237" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏قيمة واحدة لكل طالب في مادة: ENROLLMENT — فصار لاختبار الزوج صندوق يشير إليه.</text></g>
<g class="en"><text x="36" y="256" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Grade is o: it is known only when the subject ends. The date is *: known on the day of enrolment.</text></g><g class="ar"><text x="824" y="256" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏Grade اختيارية (o): لا تُعرف إلا حين تنتهي المادة. والتاريخ إلزامي (*): يُعرف يوم التسجيل.</text></g>
<g class="en"><text x="36" y="275" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Nothing moved out of STUDENT or SUBJECT except what never belonged there.</text></g><g class="ar"><text x="824" y="275" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏لم يخرج من STUDENT أو SUBJECT إلا ما لم يكن ينتمي إليهما أصلًا.</text></g>
</svg>