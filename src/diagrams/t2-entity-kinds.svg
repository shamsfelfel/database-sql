<rect x="380" y="172" width="200" height="48" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/><text x="480.0" y="201.0" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">JOB</text>
<rect x="380" y="236" width="200" height="48" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/><text x="480.0" y="265.0" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">PRODUCT TYPE</text>
<rect x="660" y="44" width="280" height="330" rx="6" style="fill:var(--dg-cluster-fill, var(--surface-2));stroke:var(--dg-cluster-stroke, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="800" y="70" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:14px;font-weight:700">Event</text></g><g class="ar"><text x="800" y="70" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:15px;font-weight:700">حدث</text></g>
<g class="en"><text x="800" y="90" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">it happens, at a time</text></g><g class="ar"><text x="800" y="90" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">يقع، في وقتٍ ما</text></g>
<rect x="700" y="108" width="200" height="48" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/><text x="800.0" y="137.0" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">BOOK TRANSACTION</text>
<rect x="700" y="172" width="200" height="48" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/><text x="800.0" y="201.0" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CONCERT</text>
<g class="en"><text x="480" y="396" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">all three are entities: each is a set of similar things you can list</text></g><g class="ar"><text x="480" y="396" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">الثلاثة كلّها كيانات: كلٌّ منها مجموعة أشياء متشابهة يمكنك سردها</text></g>
