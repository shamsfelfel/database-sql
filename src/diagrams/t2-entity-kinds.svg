<g class="en"><text x="160" y="70" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:14px;font-weight:700">Tangible</text></g><g class="ar"><text x="160" y="70" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:15px;font-weight:700">ملموس</text></g>
