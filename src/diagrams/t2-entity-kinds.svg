<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" direction="ltr" role="img" aria-labelledby="t2-entity-kinds-t">
<title id="t2-entity-kinds-t">Tangible, intangible and event entities, with library and slide examples / كيانات ملموسة وغير ملموسة وأحداث، بأمثلة من المكتبة والشرائح</title>
<g class="en"><text x="480" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Three kinds of entity</text></g><g class="ar"><text x="480" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">ثلاثة أنواع من الكيانات</text></g>
