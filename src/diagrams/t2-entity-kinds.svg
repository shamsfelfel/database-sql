<g class="en"><text x="480" y="70" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:14px;font-weight:700">Intangible</text></g><g class="ar"><text x="480" y="70" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:15px;font-weight:700">غير ملموس</text></g>
<g class="en"><text x="480" y="90" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">the senses cannot perceive it</text></g><g class="ar"><text x="480" y="90" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">لا تدركه الحواس</text></g>
