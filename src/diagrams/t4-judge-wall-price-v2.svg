<text x="448" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Striped wallpaper</text>
<text x="608" y="132" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">25</text>
<text x="748" y="132" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px;font-weight:700">in WALL COVERING</text>
<rect x="400" y="148" width="360" height="26" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:2"/>
<text x="412" y="166" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">WC3</text>
<text x="448" y="166" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Linen fabric panel</text>
<text x="608" y="166" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">60</text>
<text x="748" y="166" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px;font-weight:700">in WALL COVERING</text>
<rect x="400" y="182" width="360" height="26" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:2"/>
<text x="412" y="200" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">WC4</text>
<text x="448" y="200" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Ceramic wall tile</text>
<text x="608" y="200" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">3</text>
<text x="748" y="200" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px;font-weight:700">in WALL COVERING</text>
<rect x="400" y="216" width="360" height="26" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:2"/>
<text x="412" y="234" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">WC5</text>
<text x="448" y="234" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Oak wood panel</text>
<text x="608" y="234" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">45</text>
<text x="748" y="234" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px;font-weight:700">in WALL COVERING</text>
<rect x="40" y="398" width="720" height="80" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:2"/>
<g class="en"><text x="56" y="421" text-anchor="start" style="fill:var(--dg-good, var(--text));font-family:var(--font, sans-serif);font-size:12px">Fixed: * Price is listed once, in the supertype, and every subtype inherits it.</text></g><g class="ar"><text x="744" y="421" text-anchor="start" direction="rtl" style="fill:var(--dg-good, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">أُصلح: Price مذكورة مرّة واحدة، في النوع الأعلى، ويرثها كل نوع فرعي.</text></g>
<g class="en"><text x="56" y="441" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Each subtype keeps only what is its own. OTHER lists nothing, and still has a code, a description and a price.</text></g><g class="ar"><text x="744" y="441" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">لا يحتفظ كل نوع فرعي إلا بما يخصّه. لا يذكر OTHER شيئًا، ومع ذلك له رمز ووصف وسعر.</text></g>
<g class="en"><text x="56" y="461" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">A new subtype cannot forget the price: it inherits it the moment it is drawn inside.</text></g><g class="ar"><text x="744" y="461" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">ولا يمكن لنوع فرعي جديد أن ينسى السعر: فهو يرثه لحظة يُرسم في الداخل.</text></g>
</svg>
