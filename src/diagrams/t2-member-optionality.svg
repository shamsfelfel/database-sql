<rect x="30" y="230" width="840" height="52" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1.4"/>
<g class="en"><text x="450" y="252" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:11.5px">Every * row is filled in both members. Only o rows may hold null: Sara has no state; Omar has no state and no cell phone.</text></g><g class="ar"><text x="450" y="252" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:12.5px">كل صفّ عليه * ممتلئ عند العضوين. والصفوف التي عليها o وحدها يجوز أن تحمل null: لا ولاية لـ Sara، ولا ولاية ولا هاتف لـ Omar.</text></g>
<g class="en"><text x="450" y="271" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:11.5px">Null is unavailable, unassigned, unknown or empty — not a zero and not a space.</text></g><g class="ar"><text x="450" y="271" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:12.5px">القيمة null غير متوفّرة أو غير مُسندة أو مجهولة أو فارغة — وليست صفرًا ولا مسافة.</text></g>
</svg>
