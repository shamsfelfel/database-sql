<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" direction="ltr" role="img" aria-labelledby="t4-pay-one-v1-t">
<title id="t4-pay-one-v1-t">Version 1: PAYMENT with only the common attributes; CUSTOMER beside it with no relationship, so the card number and the cheque's customer cannot be recorded / الإصدار 1: PAYMENT بالخصائص المشتركة وحدها؛ وCUSTOMER بجانبه بلا علاقة، فلا يمكن تسجيل رقم البطاقة ولا زبون الشيك</title>
<g class="en"><text x="390.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 1 — one entity, common attributes only</text></g><g class="ar"><text x="390.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">الإصدار 1 — كيان واحد، بالخصائص المشتركة وحدها</text></g>
<rect x="60" y="52" width="230" height="97" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="175.0" y="74" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">PAYMENT</text>
<text x="74" y="96" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># Payment ID</text>
<text x="74" y="115" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Payment Date</text>
<text x="74" y="134" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Amount</text>
<rect x="500" y="52" width="220" height="78" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="610.0" y="74" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CUSTOMER</text>
<text x="514" y="96" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># Customer ID</text>
<text x="514" y="115" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Name</text>
<g class="en"><text x="395" y="100" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11.5px">no relationship</text></g><g class="ar"><text x="395" y="100" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12.5px">لا علاقة</text></g>
<path d="M300 110 L490 110" style="stroke:var(--dg-alt-stroke, var(--text-soft));stroke-width:1;fill:none;stroke-dasharray:2 5"/>
<g class="en"><text x="395" y="128" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11px">(nothing links them)</text></g><g class="ar"><text x="395" y="128" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12px">(لا شيء يربطهما)</text></g>
<rect x="40" y="196" width="700" height="120" rx="6" style="fill:var(--dg-bad-soft, var(--surface));stroke:var(--dg-bad, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="219" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Stores: the date and the amount of every payment.</text></g><g class="ar"><text x="724" y="219" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">يحفظ: تاريخ كل دفعة ومبلغها.</text></g>
<g class="en"><text x="56" y="239" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Cannot store: payment 3's card number — PAYMENT has no attribute for it.</text></g><g class="ar"><text x="724" y="239" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">لا يستطيع أن يحفظ: رقم بطاقة الدفعة 3 — فليس في PAYMENT خاصية له.</text></g>
<g class="en"><text x="56" y="259" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Cannot store: that Linda wrote cheque 2 — there is no relationship to CUSTOMER.</text></g><g class="ar"><text x="724" y="259" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">ولا يستطيع أن يحفظ: أن Linda كتبت الشيك 2 — فلا علاقة مع CUSTOMER.</text></g>
<g class="en"><text x="56" y="279" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Defect: lost data. The model is tidy only because it ignores what makes payments differ.</text></g><g class="ar"><text x="724" y="279" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">العيب: بيانات ضائعة. النموذج مرتّب فقط لأنه يتجاهل ما يجعل المدفوعات مختلفة.</text></g>
</svg>
