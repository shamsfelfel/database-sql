<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 396" direction="ltr" role="img" aria-labelledby="t5-many-four-t">
<title id="t5-many-four-t">Four one-to-many relationships with the crow's foot at the left entity: ORDER/CUSTOMER solid-solid, CUSTOMER/SALES REPRESENTATIVE solid-dashed, STUDENT/STUDY GROUP dashed-solid, DVD/PERSON dashed-dashed / أربع علاقات واحد إلى متعدّد ورِجل الغراب عند الكيان الأيسر: ORDER/CUSTOMER متّصل-متّصل، CUSTOMER/SALES REPRESENTATIVE متّصل-متقطّع، STUDENT/STUDY GROUP متقطّع-متّصل، DVD/PERSON متقطّع-متقطّع</title>
<g class="en"><text x="390" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Four one-to-many lines: the same crow's foot, two meanings of many</text></g><g class="ar"><text x="390" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">‏أربعة خطوط «واحد إلى متعدّد»: رِجل الغراب نفسها، ومعنيان للمتعدّد</text></g>
<g class="en"><text x="40" y="58" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11px">many end (child)</text></g><g class="ar"><text x="210" y="58" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12px">‏الطرف المتعدّد (الابن)</text></g>
<g class="en"><text x="340" y="58" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11px">one end (parent)</text></g><g class="ar"><text x="540" y="58" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12px">‏طرف الواحد (الأب)</text></g>
<g class="en"><text x="560" y="58" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11px">many means …</text></g><g class="ar"><text x="760" y="58" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12px">‏المتعدّد يعني …</text></g>
