<g class="en"><text x="56" y="347" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">The half at the child (left) says whether the foreign key may be null.</text></g><g class="ar"><text x="744" y="347" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‏النصف عند الابن (يسارًا) يقول هل يجوز أن يكون المفتاح الأجنبي null.</text></g>
<g class="en"><text x="56" y="366" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">The half at the parent (right) says whether many starts at zero or at one.</text></g><g class="ar"><text x="744" y="366" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏والنصف عند الأب (يمينًا) يقول هل يبدأ المتعدّد من الصفر أم من الواحد.</text></g></svg>
