<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 285" direction="ltr" role="img" aria-labelledby="t5-student-merged-t">
<title id="t5-student-merged-t">STUDENT as one entity with ID, first name, last name, phone and email: the one-to-one has disappeared / STUDENT كيانًا واحدًا بمعرّف واسم أول واسم عائلة وهاتف وبريد: اختفت علاقة واحد إلى واحد</title>
<g class="en"><text x="390" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 2: one entity, one box</text></g><g class="ar"><text x="390" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">‏الإصدار 2: كيان واحد، صندوق واحد</text></g>
<rect x="275" y="50" width="230" height="133" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="390.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">STUDENT</text>
<text x="289" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># ID</text>
<text x="289" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* First Name</text>
<text x="289" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Last Name</text>
<text x="289" y="151" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Phone</text>
<text x="289" y="170" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Email</text>
<rect x="40" y="160" width="700" height="37" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<text x="56" y="183" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">STUDENT  1001  Sara  Hamdan  0599-100100  sara@school.ps</text>
<rect x="40" y="211" width="700" height="56" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="232" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Phone and Email were attributes of STUDENT all along: they move into the box.</text></g><g class="ar"><text x="724" y="232" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‏كان Phone وEmail خاصّيتين لـ STUDENT منذ البداية: فتنتقلان إلى الصندوق.</text></g>
<g class="en"><text x="56" y="251" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">No line, no second UID, nothing to join. One student, one instance.</text></g><g class="ar"><text x="724" y="251" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏لا خطّ، ولا معرّف ثانٍ، ولا شيء يُربط. طالب واحد، ونسخة واحدة.</text></g></svg>
