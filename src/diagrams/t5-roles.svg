<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 348" direction="ltr" role="img" aria-labelledby="t5-roles-t">
<title id="t5-roles-t">PERSON acting as TEACHER and acting as STUDENT: two one-to-one relationships, each solid at the role and dashed at PERSON / PERSON acting as TEACHER وacting as STUDENT: علاقتا واحد إلى واحد، كلٌّ منهما متّصلة عند الدور ومتقطّعة عند PERSON</title>
<g class="en"><text x="430" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">The slides' roles: two 1:1 lines, mandatory at one end</text></g><g class="ar"><text x="430" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">‏أدوار الشرائح: خطّا ‎1:1، إلزاميان عند طرف واحد</text></g>
<rect x="30" y="70" width="190" height="76" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="125.0" y="92" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">TEACHER</text>
<text x="44" y="114" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># ID</text>
<text x="44" y="133" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Hire Date</text>
<rect x="335" y="50" width="190" height="114" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="430.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">PERSON</text>
<text x="349" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># ID</text>
<text x="349" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* First Name</text>
<text x="349" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Last Name</text>
<text x="349" y="151" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Phone</text>
<rect x="640" y="70" width="190" height="76" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="735.0" y="92" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">STUDENT</text>
<text x="654" y="114" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># ID</text>
<text x="654" y="133" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Start Date</text>
<path d="M220 115 L277.5 115" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M277.5 115 L335 115" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<text x="228" y="107" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">role of</text>
<text x="327" y="133" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">acting as</text>
<path d="M525 115 L582.5 115" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M582.5 115 L640 115" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="533" y="107" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">acting as</text>
<text x="632" y="133" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">role of</text>
<rect x="30" y="192" width="800" height="79" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<text x="46" y="215" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each TEACHER must be the role of one and only one PERSON.</text>
<text x="46" y="236" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each PERSON may be acting as one and only one TEACHER.</text>
<text x="46" y="257" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">(and the same pair of sentences for STUDENT)</text>
<rect x="30" y="278" width="800" height="56" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="46" y="299" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Name and phone live once, in PERSON. Each role holds only what belongs to the role.</text></g><g class="ar"><text x="814" y="299" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‏الاسم والهاتف يُخزَّنان مرّة واحدة، في PERSON. وكل دور يحمل ما يخصّ الدور فقط.</text></g>
<g class="en"><text x="46" y="318" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Solid at the role: no teacher without a person. Dashed at PERSON: not every person teaches.</text></g><g class="ar"><text x="814" y="318" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏متّصل عند الدور: لا معلّم بلا شخص. ومتقطّع عند PERSON: ليس كل شخص معلّمًا.</text></g></svg>
