<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" direction="ltr" role="img" aria-labelledby="t3-book-author-t">
<title id="t3-book-author-t">BOOK above AUTHOR, joined by a vertical line: solid half and crow's foot at BOOK named written by, dashed half and single toe at AUTHOR named the author of; read top to bottom first, then bottom to top / BOOK فوق AUTHOR يصلهما خط عمودي: نصف متّصل وقدم غراب عند BOOK باسم written by، ونصف متقطّع وإصبع واحدة عند AUTHOR باسم the author of؛ يُقرأ من الأعلى إلى الأسفل أوّلًا، ثم من الأسفل إلى الأعلى</title>
<g class="en"><text x="380.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Drawn top to bottom: read the upper entity first</text></g><g class="ar"><text x="380.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">مرسوم من الأعلى إلى الأسفل: اقرأ الكيان العلوي أوّلًا</text></g>
<rect x="60" y="50" width="220" height="76" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="170.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">BOOK</text>
<text x="74" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Book ID</text>
<text x="74" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Title</text>
<rect x="60" y="270" width="220" height="76" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="170.0" y="292" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">AUTHOR</text>
<text x="74" y="314" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Author ID</text>
<text x="74" y="333" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Name</text>
<path d="M170 126 L170 198" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M170 198 L170 270" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M170 140 L162 126" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M170 140 L170 126" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M170 140 L178 126" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="180" y="154" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">written by</text>
<text x="160" y="256" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">the author of</text>
<rect x="330" y="50" width="400" height="136" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="346" y="72" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:11.5px;font-weight:600">1st reading · top to bottom</text></g><g class="ar"><text x="714" y="72" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:12.5px;font-weight:600">القراءة الأولى · من الأعلى إلى الأسفل</text></g>
<text x="346" y="98" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">1 EACH  2 BOOK  3 MUST BE</text>
<text x="346" y="118" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">4 WRITTEN BY</text>
<text x="346" y="138" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">5 ONE AND ONLY ONE  6 AUTHOR</text>
<g class="en"><text x="346" y="170" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:10.5px">solid half at BOOK · single toe at AUTHOR</text></g><g class="ar"><text x="714" y="170" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:11.5px">نصف متّصل عند BOOK · إصبع واحدة عند AUTHOR</text></g>
<rect x="330" y="200" width="400" height="136" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="346" y="222" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:11.5px;font-weight:600">2nd reading · bottom to top</text></g><g class="ar"><text x="714" y="222" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:12.5px;font-weight:600">القراءة الثانية · من الأسفل إلى الأعلى</text></g>
<text x="346" y="248" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">1 EACH  2 AUTHOR  3 MAY BE</text>
<text x="346" y="268" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">4 THE AUTHOR OF</text>
<text x="346" y="288" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">5 ONE OR MORE  6 BOOKs</text>
<g class="en"><text x="346" y="320" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:10.5px">dashed half at AUTHOR · crow's foot at BOOK</text></g><g class="ar"><text x="714" y="320" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:11.5px">نصف متقطّع عند AUTHOR · قدم الغراب عند BOOK</text></g>
<g class="en"><text x="380" y="384" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11px">Slides DFo 2-6: a book has one author; an author may have no book in the library yet.</text></g><g class="ar"><text x="380" y="384" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12px">شرائح DFo 2-6: للكتاب مؤلّف واحد، وقد لا يكون للمؤلّف كتاب في المكتبة بعد.</text></g>
</svg>
