<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 492" direction="ltr" role="img" aria-labelledby="t4-pay-customer-inside-t">
<title id="t4-pay-customer-inside-t">PAYMENT with CASH, CHECK, CREDIT CARD and, wrongly, CUSTOMER drawn inside it; CUSTOMER fails the 'is a kind of' test / PAYMENT وفي داخله CASH وCHECK وCREDIT CARD، ومعها CUSTOMER خطأً؛ فـ CUSTOMER لا يجتاز اختبار «نوع من»</title>
<g class="en"><text x="400.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 1 — CUSTOMER drawn inside PAYMENT</text></g><g class="ar"><text x="400.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">الإصدار 1 — CUSTOMER مرسوم داخل PAYMENT</text></g>
<rect x="40" y="50" width="300" height="342" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="190.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">PAYMENT</text>
<text x="54" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># Payment ID</text>
<text x="54" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Payment Date</text>
<text x="54" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Amount</text>
<rect x="60" y="147" width="260" height="30" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="190.0" y="168" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CASH</text>
<rect x="60" y="189" width="260" height="30" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="190.0" y="210" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CHECK</text>
<rect x="60" y="231" width="260" height="55" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="190.0" y="252" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CREDIT CARD</text>
<text x="74" y="273" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Card Number</text>
<rect x="60" y="298" width="260" height="74" rx="10" style="fill:var(--dg-bad-soft, var(--surface));stroke:var(--dg-bad, var(--text-soft));stroke-width:2"/>
<text x="190.0" y="319" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CUSTOMER</text>
<text x="74" y="340" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># Customer ID</text>
<text x="74" y="359" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Name</text>
<path d="M320 335 L420 335" style="stroke:var(--dg-bad, var(--text-soft));stroke-width:1.6;fill:none"/>
<rect x="420" y="292" width="340" height="102" rx="6" style="fill:var(--dg-bad-soft, var(--surface));stroke:var(--dg-bad, var(--text-soft));stroke-width:2"/>
<g class="en"><text x="436" y="315" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Read it inwards-out:</text></g><g class="ar"><text x="744" y="315" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">اقرأه من الداخل إلى الخارج:</text></g>
<g class="en"><text x="436" y="335" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">“Every CUSTOMER is a PAYMENT.”</text></g><g class="ar"><text x="744" y="335" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">«كل CUSTOMER هو PAYMENT.»</text></g>
<g class="en"><text x="436" y="355" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">False: Linda makes payments;</text></g><g class="ar"><text x="744" y="355" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">خطأ: Linda تقوم بدفعات،</text></g>
<g class="en"><text x="436" y="375" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">she is not one.</text></g><g class="ar"><text x="744" y="375" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">لكنها ليست دفعة.</text></g>
<rect x="420" y="66" width="340" height="122" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="436" y="89" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Questions to ask of each inner box:</text></g><g class="ar"><text x="744" y="89" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">اسأل عن كل صندوق داخلي:</text></g>
<g class="en"><text x="436" y="109" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Is a CASH a kind of PAYMENT?  yes</text></g><g class="ar"><text x="744" y="109" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">هل CASH نوع من PAYMENT؟  نعم</text></g>
<g class="en"><text x="436" y="129" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Is a CHECK a kind of PAYMENT?  yes</text></g><g class="ar"><text x="744" y="129" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">هل CHECK نوع من PAYMENT؟  نعم</text></g>
<g class="en"><text x="436" y="149" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Is a CREDIT CARD a kind of PAYMENT?  yes</text></g><g class="ar"><text x="744" y="149" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">هل CREDIT CARD نوع من PAYMENT؟  نعم</text></g>
<g class="en"><text x="436" y="169" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Is a CUSTOMER a kind of PAYMENT?  no</text></g><g class="ar"><text x="744" y="169" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">هل CUSTOMER نوع من PAYMENT؟  لا</text></g>
<rect x="40" y="410" width="720" height="62" rx="6" style="fill:var(--dg-bad-soft, var(--surface));stroke:var(--dg-bad, var(--text-soft));stroke-width:2"/>
<g class="en"><text x="56" y="433" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Defect: CUSTOMER fails rule one. It is related to payments, not a kind of payment,</text></g><g class="ar"><text x="744" y="433" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">العيب: لا يجتاز CUSTOMER القاعدة الأولى. فهو مرتبط بالدفعات، لا نوعٌ منها،</text></g>
<g class="en"><text x="56" y="453" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">so it belongs outside PAYMENT, joined to CHECK and CREDIT CARD by a relationship line.</text></g><g class="ar"><text x="744" y="453" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">فمكانه خارج PAYMENT، موصولًا بـ CHECK وCREDIT CARD بخطّ علاقة.</text></g>
</svg>
