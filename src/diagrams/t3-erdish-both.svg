<g class="en"><text x="56" y="378" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11px">Every mark on the line is now said once — and nothing is said that is not drawn.</text></g><g class="ar"><text x="764" y="378" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12px">كل علامة على الخط قيلت الآن مرّة واحدة — ولم يُقَل شيء غير مرسوم.</text></g>
