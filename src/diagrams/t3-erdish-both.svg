<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" direction="ltr" role="img" aria-labelledby="t3-erdish-both-t">
<title id="t3-erdish-both-t">Version 3: the full EMPLOYEE-DEPARTMENT line and its two six-part ERDish sentences, read left to right then right to left, each part numbered 1 to 6 / الإصدار 3: خط EMPLOYEE-DEPARTMENT كاملًا وجملتا ERDish ذواتا الأجزاء الستة، تُقرأ الأولى من اليسار إلى اليمين ثم الثانية من اليمين إلى اليسار، وكل جزء مرقّم من 1 إلى 6</title>
