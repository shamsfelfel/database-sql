<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 531" direction="ltr" role="img" aria-labelledby="t4-pay-fourth-t">
<title id="t4-pay-fourth-t">The PAYMENT hierarchy after a fourth method arrives: a new WALLET box inside PAYMENT with Wallet ID, and one new line to CUSTOMER, both highlighted / تسلسل PAYMENT بعد وصول طريقة رابعة: صندوق WALLET جديد داخل PAYMENT فيه Wallet ID، وخطّ جديد واحد إلى CUSTOMER، وكلاهما مميَّز</title>
<g class="en"><text x="400.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">A fourth method arrives — WALLET</text></g><g class="ar"><text x="400.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">وصلت طريقة رابعة — WALLET</text></g>
<rect x="40" y="50" width="260" height="337" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
