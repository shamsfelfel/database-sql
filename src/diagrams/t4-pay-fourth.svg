<text x="552" y="273.5" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">make</text>
<rect x="40" y="407" width="720" height="92" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="430" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Added: one subtype box, one attribute, one line. Nothing that existed was touched.</text></g><g class="ar"><text x="744" y="430" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">أُضيف: صندوق نوع فرعي واحد، وخاصية واحدة، وخط واحد. ولم يُمسّ شيء ممّا كان موجودًا.</text></g>
<g class="en"><text x="56" y="450" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">WALLET inherits # Payment ID, * Payment Date and * Amount from PAYMENT — not redrawn.</text></g><g class="ar"><text x="744" y="450" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">يرث WALLET من PAYMENT رقمَ الدفعة وتاريخها ومبلغها — دون إعادة رسمها.</text></g>
<g class="en"><text x="56" y="470" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Every query about 'all payments' still reads one entity, so it does not change either.</text></g><g class="ar"><text x="744" y="470" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">وكل استعلام عن «كل المدفوعات» ما زال يقرأ كيانًا واحدًا، فلا يتغيّر هو أيضًا.</text></g>
</svg>
