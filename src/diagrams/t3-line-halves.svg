<g class="en"><text x="56" y="371" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:11.5px">Each end is answered on its own half. Start at an entity, look at the half beside it: solid says must, dashed says may.</text></g><g class="ar"><text x="764" y="371" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:12.5px">يُجاب عن كل طرف في نصفه الخاص. ابدأ من كيان، وانظر إلى النصف المجاور له: المتّصل يقول «يجب»، والمتقطّع يقول «قد».</text></g>
<g class="en"><text x="56" y="392" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11.5px">The ends of the line (one toe, three toes) are cardinality: Lesson 3.</text></g><g class="ar"><text x="764" y="392" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12.5px">أمّا طرفا الخط (إصبع واحدة أو ثلاث) فهما التعدّدية: الدرس 3.</text></g></svg>
