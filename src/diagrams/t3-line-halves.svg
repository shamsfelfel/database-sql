<title id="t3-line-halves-t">Three relationships showing both halves solid (CUSTOMER and ORDER), one solid and one dashed (EMPLOYEE and DEPARTMENT), and both dashed (TRAVELER and COUNTRY), each with its two readings / ثلاث علاقات: نصفان متّصلان (CUSTOMER وORDER)، ونصف متّصل ونصف متقطّع (EMPLOYEE وDEPARTMENT)، ونصفان متقطّعان (TRAVELER وCOUNTRY)، ولكلٍّ قراءتاها</title>
<g class="en"><text x="410.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Which half is solid? The half next to the entity whose rule is must</text></g><g class="ar"><text x="410.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">أيّ نصف متّصل؟ النصف المجاور للكيان الذي قاعدته «يجب»</text></g>
<g class="en"><text x="40" y="56" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px;font-weight:600">Line</text></g><g class="ar"><text x="440" y="56" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px;font-weight:600">الخط</text></g>
