<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" direction="ltr" role="img" aria-labelledby="t3-card-job-v2-t">
<title id="t3-card-job-v2-t">Version 2: EMPLOYEE hold / held by JOB with a crow's foot at EMPLOYEE and a single toe at JOB: each employee holds one and only one job, a job may be held by one or more employees / الإصدار 2: علاقة EMPLOYEE hold / held by JOB بقدم غراب عند EMPLOYEE وإصبع واحدة عند JOB: يشغل كل موظّف وظيفة واحدة فقط، وقد يشغل الوظيفةَ موظّف أو أكثر</title>
<g class="en"><text x="390.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 2 — each symbol at the end it describes</text></g><g class="ar"><text x="390.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">الإصدار 2 — كل رمز عند الطرف الذي يصفه</text></g>
<rect x="40" y="50" width="210" height="158" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="145.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">EMPLOYEE</text>
<text x="54" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Employee ID</text>
<text x="54" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* First Name</text>
<text x="54" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Last Name</text>
<text x="54" y="151" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Hire Date</text>
<text x="54" y="170" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Salary</text>
<text x="54" y="189" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">o Commission</text>
<rect x="530" y="50" width="210" height="120" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="635.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">JOB</text>
<text x="544" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Job ID</text>
<text x="544" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Title</text>
<text x="544" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Max Salary</text>
<text x="544" y="151" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Min Salary</text>
<path d="M250 112 L390.0 112" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M390.0 112 L530 112" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M264 112 L250 104" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M264 112 L250 112" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M264 112 L250 120" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="270" y="104" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">hold</text>
<text x="522" y="130" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">held by</text>
<g class="en"><text x="258" y="150" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11px">crow's foot: one or more</text></g><g class="ar"><text x="402" y="150" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12px">قدم غراب: واحد أو أكثر</text></g>
<g class="en"><text x="522" y="168" text-anchor="end" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11px">single toe: one and only one</text></g><g class="ar"><text x="522" y="168" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12px">إصبع واحدة: واحد فقط لا غير</text></g>
<rect x="40" y="230" width="700" height="56" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<text x="56" y="252" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each EMPLOYEE must hold one and only one JOB.</text>
<text x="56" y="272" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each JOB may be held by one or more EMPLOYEEs.</text>
<rect x="40" y="302" width="700" height="56" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="324" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Tyler and Mariam both hold SA_REP, and each of them has exactly one salary range.</text></g><g class="ar"><text x="724" y="324" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">يشغل Tyler وMariam كلاهما SA_REP، ولكلٍّ منهما حدود راتب واحدة بالضبط.</text></g>
<g class="en"><text x="56" y="344" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Read the end at the far entity: one and only one JOB; one or more EMPLOYEEs.</text></g><g class="ar"><text x="724" y="344" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">اقرأ الطرف عند الكيان البعيد: JOB واحدة فقط لا غير؛ وEMPLOYEE واحد أو أكثر.</text></g>
</svg>
