<g class="en"><text x="56" y="403" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Maths has Grade A. Whose A: Sara's, Omar's? The row cannot say which STUDENT.</text></g><g class="ar"><text x="724" y="403" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‏للرياضيات الدرجة A. درجة مَن: Sara أم Omar؟ لا يستطيع الصفّ أن يقول أيّ STUDENT.</text></g>
<g class="en"><text x="56" y="422" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Either way, one value per instance — and a student has one grade per subject.</text></g><g class="ar"><text x="724" y="422" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏وفي الحالتين قيمة واحدة لكل نسخة — أمّا الطالب فله درجة لكل مادة.</text></g></svg>
