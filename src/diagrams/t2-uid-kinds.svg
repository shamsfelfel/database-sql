<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 472" direction="ltr" role="img" aria-labelledby="t2-uid-kinds-t">
<title id="t2-uid-kinds-t">Three UIDs: a single artificial attribute, a combination, and a combination of natural attributes that fails / ثلاثة معرّفات فريدة: خاصية اصطناعية واحدة، وتركيبة، وتركيبة من خصائص طبيعية تفشل</title>
<g class="en"><text x="490.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">One attribute, a combination — and the combination that fails</text></g><g class="ar"><text x="490.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">خاصية واحدة، وتركيبة — والتركيبة التي تفشل</text></g>
<g class="en"><text x="160" y="60" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:700">1 · one attribute</text></g><g class="ar"><text x="160" y="60" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:700">١ · خاصية واحدة</text></g>
<rect x="65" y="76" width="190" height="97" rx="10" style="fill:var(--dg-good-soft, var(--good-soft));stroke:var(--dg-good, var(--good));stroke-width:2"/>
<text x="160.0" y="98" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">MEMBER</text>
<text x="79" y="120" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Id</text>
<text x="79" y="139" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* First Name</text>
<text x="79" y="158" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Last Name</text>
<g class="en"><text x="160" y="210" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Id is invented by the library:</text></g><g class="ar"><text x="160" y="210" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">Id اخترعتها المكتبة:</text></g>
<g class="en"><text x="160" y="228" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">an artificial UID.</text></g><g class="ar"><text x="160" y="228" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">معرّف فريد اصطناعي.</text></g>
<g class="en"><text x="160" y="252" text-anchor="middle" style="fill:var(--dg-good, var(--good));font-family:var(--font, sans-serif);font-size:12px;font-weight:600">✓ unique for every member</text></g><g class="ar"><text x="160" y="252" text-anchor="middle" direction="rtl" style="fill:var(--dg-good, var(--good));font-family:var(--font-ar, sans-serif);font-size:13px;font-weight:600">✓ فريدة لكل عضو</text></g>
<g class="en"><text x="500" y="60" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:700">2 · a combination</text></g><g class="ar"><text x="500" y="60" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:700">٢ · تركيبة</text></g>
<rect x="400" y="76" width="200" height="78" rx="10" style="fill:var(--dg-good-soft, var(--good-soft));stroke:var(--dg-good, var(--good));stroke-width:2"/>
<text x="500.0" y="98" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">BOOK TRANSACTION</text>
<text x="414" y="120" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Tran Date</text>
<text x="414" y="139" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">o Type</text>
<rect x="400" y="250" width="200" height="78" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="500.0" y="272" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">BOOK</text>
<text x="414" y="294" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Id</text>
<text x="414" y="313" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">U * Title</text>
<path d="M500 154 L500 202.0" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M500 202.0 L500 250" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M500 168 L492 154" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M500 168 L500 154" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M500 168 L508 154" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M492 176 L508 176" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-width:2"/>
<text x="512" y="180" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">be included in</text>
<text x="512" y="240" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">include</text>
<text x="500" y="352" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px;font-weight:700"># Tran Date + BOOK</text>
<g class="en"><text x="500" y="372" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">the bar on the line adds BOOK to the UID (T5)</text></g><g class="ar"><text x="500" y="372" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">الشَّرطة على الخط تضيف BOOK إلى المعرّف (T5)</text></g>
<g class="en"><text x="500" y="394" text-anchor="middle" style="fill:var(--dg-good, var(--good));font-family:var(--font, sans-serif);font-size:12px;font-weight:600">✓ one row per book per day</text></g><g class="ar"><text x="500" y="394" text-anchor="middle" direction="rtl" style="fill:var(--dg-good, var(--good));font-family:var(--font-ar, sans-serif);font-size:13px;font-weight:600">✓ صفّ واحد لكل كتاب في كل يوم</text></g>
<g class="en"><text x="840" y="60" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:700">3 · natural attributes only</text></g><g class="ar"><text x="840" y="60" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:700">٣ · خصائص طبيعية فقط</text></g>
<rect x="740" y="76" width="200" height="97" rx="10" style="fill:var(--dg-bad-soft, var(--bad-soft));stroke:var(--dg-bad, var(--bad));stroke-width:2"/>
<text x="840.0" y="98" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">STUDENT</text>
<text x="754" y="120" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * First Name</text>
<text x="754" y="139" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Last Name</text>
<text x="754" y="158" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Birth Date</text>
<g class="en"><text x="840" y="210" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Three real-world facts</text></g><g class="ar"><text x="840" y="210" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">ثلاث حقائق من العالم الحقيقي</text></g>
<g class="en"><text x="840" y="228" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">combined into one UID.</text></g><g class="ar"><text x="840" y="228" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">مجتمعة في معرّف واحد.</text></g>
<g class="en"><text x="840" y="252" text-anchor="middle" style="fill:var(--dg-bad, var(--bad));font-family:var(--font, sans-serif);font-size:12px;font-weight:600">✗ two students could share all three</text></g><g class="ar"><text x="840" y="252" text-anchor="middle" direction="rtl" style="fill:var(--dg-bad, var(--bad));font-family:var(--font-ar, sans-serif);font-size:13px;font-weight:600">✗ قد يشترك طالبان في الثلاث</text></g>
<rect x="30" y="418" width="920" height="40" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="46" y="443" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Every attribute marked # is part of the UID. One # = a single-attribute UID; several # = a composite UID.</text></g><g class="ar"><text x="934" y="443" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">كل خاصية عليها # جزء من المعرّف الفريد. علامة # واحدة = معرّف من خاصية واحدة، وعدّة علامات # = معرّف مركّب.</text></g>
</svg>
