<g class="en"><text x="46" y="649" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">QUIZ's line to BONUS QUESTION is correct: only quizzes include bonus questions.</text></g><g class="ar"><text x="864" y="649" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">خطّ QUIZ إلى BONUS QUESTION صحيح: فالاختبارات القصيرة وحدها تتضمّن أسئلة إضافية.</text></g>
