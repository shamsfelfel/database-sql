<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 598" direction="ltr" role="img" aria-labelledby="t4-pay-card-nested-t">
<title id="t4-pay-card-nested-t">Version 2: CARD as a subtype of PAYMENT holding Card Number and the made by relationship, with CREDIT CARD and DEBIT CARD nested inside it / الإصدار 2: CARD نوعًا فرعيًّا لـ PAYMENT يحمل Card Number وعلاقة made by، وفي داخله CREDIT CARD وDEBIT CARD متداخلين</title>
<g class="en"><text x="400.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 2 — CARD, with CREDIT CARD and DEBIT CARD nested inside it</text></g><g class="ar"><text x="400.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">الإصدار 2 — CARD، وفي داخله CREDIT CARD وDEBIT CARD متداخلين</text></g>
<rect x="40" y="50" width="300" height="436" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="190.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">PAYMENT</text>
<text x="54" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># Payment ID</text>
<text x="54" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Payment Date</text>
<text x="54" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Amount</text>
<rect x="60" y="153" width="260" height="30" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="190.0" y="175" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CASH</text>
<rect x="60" y="195" width="260" height="30" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="190.0" y="217" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CHECK</text>
<rect x="60" y="237" width="260" height="187" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="190.0" y="259" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CARD</text>
<text x="74" y="281" text-anchor="start" style="fill:var(--dg-good, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Card Number</text>
<rect x="78" y="296" width="224" height="52" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.2"/>
<text x="190.0" y="318" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CREDIT CARD</text>
<text x="92" y="340" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Instalments</text>
<rect x="78" y="358" width="224" height="52" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.2"/>
<text x="190.0" y="380" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">DEBIT CARD</text>
<text x="92" y="402" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">o Cashback Amount</text>
<rect x="60" y="436" width="260" height="30" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="190.0" y="458" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">OTHER</text>
<rect x="580" y="186" width="180" height="78" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="670.0" y="208" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CUSTOMER</text>
<text x="594" y="230" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># Customer ID</text>
<text x="594" y="249" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Name</text>
<path d="M320 213 L450 213" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M450 213 L450 205 L580 205" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M332 213 L320 206" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M332 213 L320 213" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M332 213 L320 220" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="342" y="206" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">made by</text>
<text x="572" y="199" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">make</text>
<path d="M320 259 L480 259" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M480 259 L480 245 L580 245" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M332 259 L320 252" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M332 259 L320 259" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M332 259 L320 266" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="342" y="252" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">made by</text>
<text x="572" y="239" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">make</text>
<rect x="40" y="506" width="720" height="76" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="529" text-anchor="start" style="fill:var(--dg-good, var(--text));font-family:var(--font, sans-serif);font-size:12px">* Card Number and the made by line now appear once, in CARD; both kinds of card inherit them.</text></g><g class="ar"><text x="744" y="529" text-anchor="start" direction="rtl" style="fill:var(--dg-good, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‎* Card Number وخطّ made by يظهران الآن مرّة واحدة، في CARD؛ ويرثهما نوعا البطاقة كلاهما.</text></g>
<g class="en"><text x="56" y="549" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Level 1: CASH, CHECK, CARD, OTHER. Level 2: CREDIT CARD and DEBIT CARD, inside CARD.</text></g><g class="ar"><text x="744" y="549" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">المستوى 1: CASH وCHECK وCARD وOTHER. المستوى 2: CREDIT CARD وDEBIT CARD، داخل CARD.</text></g>
<g class="en"><text x="56" y="569" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Each card kind keeps only what is its own: Instalments for credit, Cashback Amount for debit.</text></g><g class="ar"><text x="744" y="569" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">كل نوع بطاقة لا يحمل إلا ما يخصّه: Instalments للائتمان، وCashback Amount للخصم المباشر.</text></g>
</svg>
