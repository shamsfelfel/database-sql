<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 270" direction="ltr" role="img" aria-labelledby="t5-redundant-v2-t">
<title id="t5-redundant-v2-t">Version 2: STUDENT join STUDY GROUP and STUDY GROUP supervised by TEACHER only; the direct line is removed / الإصدار 2: STUDENT join STUDY GROUP وSTUDY GROUP supervised by TEACHER فقط؛ وأُزيل الخط المباشر</title>
<g class="en"><text x="435" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 2 — the redundant line removed</text></g><g class="ar"><text x="435" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">‏الإصدار 2 — أُزيل الخط الزائد</text></g>
<rect x="30" y="60" width="180" height="99" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="120.0" y="82" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">STUDENT</text>
