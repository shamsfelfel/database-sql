<path d="M539 105 L525 113" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="543" y="97" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">supervised by</text>
<text x="652" y="123" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">supervises</text>
<rect x="30" y="176" width="810" height="30" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<text x="46" y="196" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">STUDENT --join--&gt; STUDY GROUP --supervised by--&gt; TEACHER   = the student's supervisor</text>
<rect x="30" y="214" width="810" height="54" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="46" y="235" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Fixed: one path, one answer. Nothing is lost — the supervisor is read through the study group.</text></g><g class="ar"><text x="824" y="235" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‏أُصلح: مسار واحد، وجواب واحد. ولم يضِع شيء — فالمشرف يُقرأ عبر مجموعة الدراسة.</text></g>
<g class="en"><text x="46" y="254" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">A student with no study group has no supervisor, exactly as the dashed half at STUDENT allows.</text></g><g class="ar"><text x="824" y="254" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏والطالب بلا مجموعة دراسة بلا مشرف، تمامًا كما يسمح النصف المتقطّع عند STUDENT.</text></g></svg>
