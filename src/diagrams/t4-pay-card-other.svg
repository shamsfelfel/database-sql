<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 388" direction="ltr" role="img" aria-labelledby="t4-pay-card-other-t">
<title id="t4-pay-card-other-t">PAYMENT with two subtypes, CREDIT CARD and OTHER: payments 3 and 5 are credit cards, payments 1, 2, 4 and 6 are OTHER / PAYMENT بنوعين فرعيين، CREDIT CARD وOTHER: الدفعتان 3 و5 بطاقتان، والدفعات 1 و2 و4 و6 من OTHER</title>
<g class="en"><text x="400.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 2 — another subtype to contain the rest</text></g><g class="ar"><text x="400.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">الإصدار 2 — نوع فرعي آخر يحتوي الباقي</text></g>
<rect x="40" y="50" width="280" height="214" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="180.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">PAYMENT</text>
<text x="54" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># Payment ID</text>
<text x="54" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Payment Date</text>
<text x="54" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Amount</text>
<rect x="60" y="147" width="240" height="55" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="180.0" y="168" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CREDIT CARD</text>
<text x="74" y="189" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Card Number</text>
<rect x="60" y="214" width="240" height="30" rx="10" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:2"/>
<text x="180.0" y="235" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">OTHER</text>
<g class="en"><text x="420" y="66" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px;font-weight:600">The six March payments</text></g><g class="ar"><text x="760" y="66" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px;font-weight:600">دفعات آذار الست</text></g>
<rect x="420" y="80" width="340" height="26" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:2"/>
<text x="432" y="98" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">1  40  cash</text>
<text x="748" y="98" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px;font-weight:700">→ OTHER</text>
<rect x="420" y="112" width="340" height="26" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:2"/>
<text x="432" y="130" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">2  125  cheque</text>
<text x="748" y="130" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px;font-weight:700">→ OTHER</text>
<rect x="420" y="144" width="340" height="26" rx="6" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="432" y="162" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">3  310  card</text>
<text x="748" y="162" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px;font-weight:700">→ CREDIT CARD</text>
<rect x="420" y="176" width="340" height="26" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:2"/>
<text x="432" y="194" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">4  15  cash</text>
<text x="748" y="194" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px;font-weight:700">→ OTHER</text>
<rect x="420" y="208" width="340" height="26" rx="6" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="432" y="226" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">5  220  card</text>
<text x="748" y="226" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px;font-weight:700">→ CREDIT CARD</text>
<rect x="420" y="240" width="340" height="26" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:2"/>
<text x="432" y="258" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">6  90  cheque</text>
<text x="748" y="258" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px;font-weight:700">→ OTHER</text>
<rect x="40" y="286" width="720" height="82" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:2"/>
<g class="en"><text x="56" y="309" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Two subtypes. Cash and cheques have nothing special the shop records, so they share OTHER.</text></g><g class="ar"><text x="744" y="309" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">نوعان فرعيان. ليس للنقد والشيكات ما يخصّها ممّا يسجّله المتجر، فيتشاركان OTHER.</text></g>
<g class="en"><text x="56" y="329" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Every payment is now a CREDIT CARD or an OTHER, and never both.</text></g><g class="ar"><text x="744" y="329" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">صارت كل دفعة إمّا CREDIT CARD أو OTHER، ولا تكون الاثنين أبدًا.</text></g>
<g class="en"><text x="56" y="349" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">If cheques later need their own attributes, CHECK leaves OTHER and gets its own box.</text></g><g class="ar"><text x="744" y="349" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">وإن احتاجت الشيكات لاحقًا خصائص خاصّة بها، خرج CHECK من OTHER وأخذ صندوقه.</text></g>
</svg>
