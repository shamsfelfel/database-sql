<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" direction="ltr" role="img" aria-labelledby="t2-implementation-free-t">
<title id="t2-implementation-free-t">One conceptual BOOK, one logical BOOK, two physical BOOKS tables for two products / BOOK مفاهيمي واحد، وBOOK منطقي واحد، وجدولا BOOKS فيزيائيان لمنتجين</title>
<g class="en"><text x="450" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">One logical model, one physical model per RDBMS</text></g><g class="ar"><text x="450" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">نموذج منطقي واحد، ونموذج فيزيائي لكل RDBMS</text></g>
<g class="en"><text x="20" y="82" text-anchor="start" style="fill:var(--dg-accent, var(--accent));font-family:var(--font, sans-serif);font-size:12.5px;font-weight:600">conceptual</text></g><g class="ar"><text x="110" y="82" text-anchor="start" direction="rtl" style="fill:var(--dg-accent, var(--accent));font-family:var(--font-ar, sans-serif);font-size:13.5px;font-weight:600">المفاهيمي</text></g>
