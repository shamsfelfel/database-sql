<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 422" direction="ltr" role="img" aria-labelledby="t4-animal-nested-t">
<title id="t4-animal-nested-t">The lecturer's nested ANIMAL supertype: VERTEBRATE and INVERTEBRATE at level 1, and BIRD, REPTILE, MAMMAL and OTHER inside VERTEBRATE at level 2 / النوع الأعلى ANIMAL المتداخل عند المحاضِرة: VERTEBRATE وINVERTEBRATE في المستوى 1، وBIRD وREPTILE وMAMMAL وOTHER داخل VERTEBRATE في المستوى 2</title>
<g class="en"><text x="400.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">The lecturer's nested ANIMAL supertype — two levels of subtypes</text></g><g class="ar"><text x="400.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">النوع الأعلى ANIMAL المتداخل عند المحاضِرة — مستويان من الأنواع الفرعية</text></g>
<rect x="40" y="50" width="440" height="264" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="260.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">ANIMAL</text>
<text x="54" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># Animal ID</text>
<text x="54" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Name</text>
<rect x="60" y="128" width="400" height="122" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="260.0" y="150" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">VERTEBRATE</text>
<rect x="76" y="164" width="176" height="30" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.2"/>
<text x="164.0" y="186" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">BIRD</text>
<rect x="268" y="164" width="176" height="30" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.2"/>
<text x="356.0" y="186" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">REPTILE</text>
<rect x="76" y="206" width="176" height="30" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.2"/>
<text x="164.0" y="228" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">MAMMAL</text>
<rect x="268" y="206" width="176" height="30" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.2"/>
<text x="356.0" y="228" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">OTHER</text>
<rect x="60" y="264" width="400" height="30" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="260.0" y="286" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">INVERTEBRATE</text>
<path d="M460 140 L554 140" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1;fill:none;stroke-dasharray:2 3"/>
<g class="en"><text x="560" y="144" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px;font-weight:600">level 1</text></g><g class="ar"><text x="560" y="144" text-anchor="end" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px;font-weight:600">المستوى 1</text></g>
<path d="M444 179 L554 179" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1;fill:none;stroke-dasharray:2 3"/>
<g class="en"><text x="560" y="183" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px;font-weight:600">level 2</text></g><g class="ar"><text x="560" y="183" text-anchor="end" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px;font-weight:600">المستوى 2</text></g>
<path d="M444 221 L554 221" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1;fill:none;stroke-dasharray:2 3"/>
<g class="en"><text x="560" y="225" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px;font-weight:600">level 2</text></g><g class="ar"><text x="560" y="225" text-anchor="end" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px;font-weight:600">المستوى 2</text></g>
<path d="M460 279 L554 279" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1;fill:none;stroke-dasharray:2 3"/>
<g class="en"><text x="560" y="283" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px;font-weight:600">level 1</text></g><g class="ar"><text x="560" y="283" text-anchor="end" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px;font-weight:600">المستوى 1</text></g>
<rect x="40" y="334" width="720" height="76" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="357" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">VERTEBRATE is a subtype of ANIMAL and, at the same time, the supertype of BIRD, REPTILE, MAMMAL and OTHER.</text></g><g class="ar"><text x="744" y="357" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">VERTEBRATE نوعٌ فرعي من ANIMAL، وهو في الوقت نفسه النوع الأعلى لـ BIRD وREPTILE وMAMMAL وOTHER.</text></g>
<g class="en"><text x="56" y="377" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Read inwards-out: every BIRD is a VERTEBRATE, and every VERTEBRATE is an ANIMAL.</text></g><g class="ar"><text x="744" y="377" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">اقرأه من الداخل إلى الخارج: كل BIRD هو VERTEBRATE، وكل VERTEBRATE هو ANIMAL.</text></g>
<g class="en"><text x="56" y="397" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">INVERTEBRATE has no subtypes inside it: nesting is decided box by box.</text></g><g class="ar"><text x="744" y="397" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">ليس داخل INVERTEBRATE أيّ نوع فرعي: التداخل يُقرَّر صندوقًا صندوقًا.</text></g>
</svg>
