<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" direction="ltr" role="img" aria-labelledby="t3-erdish-rec-v1-t">
<title id="t3-erdish-rec-v1-t">Version 1: a recursive EMPLOYEE relationship with the crow's foot drawn at the manager of end, so it reads that an employee may be managed by many employees and may manage only one / الإصدار 1: علاقة ذاتية على EMPLOYEE رُسمت فيها قدم الغراب عند طرف manager of، فتُقرأ أن الموظّف قد يديره موظّفون كثيرون وقد لا يدير إلا واحدًا</title>
<g class="en"><text x="390.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 1 — the crow's foot beside manager of</text></g><g class="ar"><text x="390.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">الإصدار 1 — قدم الغراب بجانب manager of</text></g>
<rect x="60" y="46" width="220" height="95" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="170.0" y="68" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">EMPLOYEE</text>
<text x="74" y="90" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Employee ID</text>
<text x="74" y="109" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* First Name</text>
<text x="74" y="128" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Last Name</text>
<path d="M120 141 L120 197 L170 197" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M170 197 L220 197 L220 141" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M220 155 L212 141" style="stroke:var(--dg-bad, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M220 155 L220 141" style="stroke:var(--dg-bad, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M220 155 L228 141" style="stroke:var(--dg-bad, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="112" y="171" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">managed by</text>
<text x="228" y="171" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">manager of</text>
<g class="en"><text x="220" y="219" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:10.5px">drawn here because 'a manager has many'</text></g><g class="ar"><text x="220" y="219" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:11.5px">رُسمت هنا لأن «المدير يدير كثيرين»</text></g>
<rect x="330" y="56" width="410" height="120" rx="6" style="fill:var(--dg-bad-soft, var(--surface));stroke:var(--dg-bad, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="346" y="80" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:11.5px">Read it, part by part:</text></g><g class="ar"><text x="724" y="80" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:12.5px">اقرأه جزءًا جزءًا:</text></g>
<text x="346" y="106" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">Each EMPLOYEE may be managed by</text>
<text x="346" y="124" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">  one or more EMPLOYEEs.</text>
<text x="346" y="148" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">Each EMPLOYEE may be the manager of</text>
<text x="346" y="166" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">  one and only one EMPLOYEE.</text>
<rect x="40" y="236" width="700" height="80" rx="6" style="fill:var(--dg-warn-soft, var(--surface));stroke:var(--dg-warn, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="260" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">The scenario: every employee has one manager; each manager can manage several employees.</text></g><g class="ar"><text x="724" y="260" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">السيناريو: لكل موظّف مدير واحد، ويستطيع كل مدير أن يدير عدّة موظّفين.</text></g>
<g class="en"><text x="56" y="284" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">The sentences say the opposite: Tyler may have many managers, Dana may manage one person only.</text></g><g class="ar"><text x="724" y="284" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">والجملتان تقولان العكس: قد يكون لـ Tyler مديرون كثيرون، وقد لا تدير Dana إلا شخصًا واحدًا.</text></g>
<g class="en"><text x="56" y="304" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">The symbol and the name at one end belong to different sentences.</text></g><g class="ar"><text x="724" y="304" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">الرمز والاسم عند الطرف نفسه ينتميان إلى جملتين مختلفتين.</text></g>
</svg>
