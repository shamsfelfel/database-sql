<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" direction="ltr" role="img" aria-labelledby="t4-pay-anatomy-t">
<title id="t4-pay-anatomy-t">Anatomy of a supertype: PAYMENT is the outer softbox holding the common attributes; CASH, CHECK and CREDIT CARD are subtypes drawn inside it; Card Number sits inside CREDIT CARD / تشريح النوع الأعلى: PAYMENT هو الصندوق الخارجي الذي يحمل الخصائص المشتركة؛ وCASH وCHECK وCREDIT CARD أنواع فرعية مرسومة داخله؛ ورقم البطاقة داخل CREDIT CARD</title>
<g class="en"><text x="400.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Reading the drawing — one supertype, three subtypes</text></g><g class="ar"><text x="400.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">قراءة الرسم — نوع أعلى واحد، وثلاثة أنواع فرعية</text></g>
<rect x="40" y="50" width="260" height="266" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="170.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">PAYMENT</text>
<text x="54" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># Payment ID</text>
<text x="54" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Payment Date</text>
<text x="54" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Amount</text>
<rect x="60" y="153" width="220" height="30" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="170.0" y="175" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CASH</text>
<rect x="60" y="195" width="220" height="30" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="170.0" y="217" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CHECK</text>
<rect x="60" y="237" width="220" height="59" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="170.0" y="259" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CREDIT CARD</text>
<text x="74" y="281" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Card Number</text>
<rect x="420" y="50" width="340" height="52" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<path d="M420 76 L300 72" style="stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1.2;fill:none;stroke-dasharray:2 3"/>
<circle cx="300" cy="72" r="3" style="fill:var(--dg-note-stroke, var(--text-soft))"/>
<g class="en"><text x="434" y="71" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px;font-weight:700">Supertype</text></g><g class="ar"><text x="746" y="71" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px;font-weight:700">النوع الأعلى (Supertype)</text></g>
<g class="en"><text x="434" y="91" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">the outer softbox; its name at the top</text></g><g class="ar"><text x="746" y="91" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">الصندوق الخارجي، واسمه في أعلاه</text></g>
<rect x="420" y="122" width="340" height="52" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<path d="M420 148 L232 113" style="stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1.2;fill:none;stroke-dasharray:2 3"/>
<circle cx="232" cy="113" r="3" style="fill:var(--dg-note-stroke, var(--text-soft))"/>
<g class="en"><text x="434" y="143" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px;font-weight:700">Common attributes</text></g><g class="ar"><text x="746" y="143" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px;font-weight:700">الخصائص المشتركة</text></g>
<g class="en"><text x="434" y="163" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">listed once, only in the supertype</text></g><g class="ar"><text x="746" y="163" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">تُذكر مرّة واحدة، في النوع الأعلى وحده</text></g>
<rect x="420" y="194" width="340" height="52" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<path d="M420 220 L280 210" style="stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1.2;fill:none;stroke-dasharray:2 3"/>
<circle cx="280" cy="210" r="3" style="fill:var(--dg-note-stroke, var(--text-soft))"/>
<g class="en"><text x="434" y="215" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px;font-weight:700">Subtype</text></g><g class="ar"><text x="746" y="215" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px;font-weight:700">النوع الفرعي (Subtype)</text></g>
<g class="en"><text x="434" y="235" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">a softbox enclosed in the supertype</text></g><g class="ar"><text x="746" y="235" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">صندوق محاط داخل النوع الأعلى</text></g>
<rect x="420" y="266" width="340" height="52" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<path d="M420 292 L200 277" style="stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1.2;fill:none;stroke-dasharray:2 3"/>
<circle cx="200" cy="277" r="3" style="fill:var(--dg-note-stroke, var(--text-soft))"/>
<g class="en"><text x="434" y="287" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px;font-weight:700">Own attribute</text></g><g class="ar"><text x="746" y="287" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px;font-weight:700">خاصية خاصّة بالنوع</text></g>
<g class="en"><text x="434" y="307" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">drawn only inside its own subtype</text></g><g class="ar"><text x="746" y="307" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">تُرسم داخل نوعها الفرعي فقط</text></g>
<rect x="40" y="346" width="720" height="64" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="369" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">CASH lists nothing of its own, yet it still has an ID, a date and an amount: it is a PAYMENT.</text></g><g class="ar"><text x="744" y="369" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">لا يذكر CASH شيئًا خاصًّا به، ومع ذلك له رقم وتاريخ ومبلغ: فهو PAYMENT.</text></g>
<g class="en"><text x="56" y="389" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Nothing common is drawn twice; nothing special is drawn in the outer box.</text></g><g class="ar"><text x="744" y="389" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">لا يُرسم شيء مشترك مرّتين، ولا يُرسم شيء خاصّ في الصندوق الخارجي.</text></g>
</svg>
