<rect x="40" y="546" width="720" height="76" rx="6" style="fill:var(--dg-bad-soft, var(--surface));stroke:var(--dg-bad, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="569" text-anchor="start" style="fill:var(--dg-bad, var(--text));font-family:var(--font, sans-serif);font-size:12px">Six level-3 boxes, and not one of them lists anything of its own.</text></g><g class="ar"><text x="744" y="569" text-anchor="start" direction="rtl" style="fill:var(--dg-bad, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">ستة صناديق في المستوى 3، ولا يذكر أيٌّ منها شيئًا خاصًّا به.</text></g>
<g class="en"><text x="56" y="589" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">VISA, MASTERCARD and OTHER are drawn twice: the brand question cuts across credit and debit.</text></g><g class="ar"><text x="744" y="589" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">VISA وMASTERCARD وOTHER مرسومة مرّتين: سؤال العلامة يقطع الائتمان والخصم المباشر معًا.</text></g>
<g class="en"><text x="56" y="609" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">To read one Visa debit payment you collect attributes from four nested boxes.</text></g><g class="ar"><text x="744" y="609" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">ولقراءة دفعة خصم مباشر واحدة بـ Visa تجمع الخصائص من أربعة صناديق متداخلة.</text></g>
</svg>
