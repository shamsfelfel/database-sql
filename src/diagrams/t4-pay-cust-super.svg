<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" direction="ltr" role="img" aria-labelledby="t4-pay-cust-super-t">
<title id="t4-pay-cust-super-t">The CUSTOMER relationship drawn on PAYMENT, mandatory at the PAYMENT end: by inheritance every CASH payment must now be made by a customer / علاقة CUSTOMER مرسومة على PAYMENT وإلزامية عند طرف PAYMENT: فبالوراثة صارت كل دفعة CASH ملزمة بأن يقوم بها زبون</title>
<g class="en"><text x="400.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">One line on the supertype — inherited by every subtype</text></g><g class="ar"><text x="400.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">خطّ واحد على النوع الأعلى — يرثه كل نوع فرعي</text></g>
<rect x="40" y="50" width="260" height="266" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="170.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">PAYMENT</text>
<text x="54" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># Payment ID</text>
<text x="54" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Payment Date</text>
<text x="54" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Amount</text>
<rect x="60" y="153" width="220" height="30" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-bad, var(--accent));stroke-width:2.6"/>
<text x="170.0" y="175" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CASH</text>
<rect x="60" y="195" width="220" height="30" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="170.0" y="217" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CHECK</text>
<rect x="60" y="237" width="220" height="59" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="170.0" y="259" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CREDIT CARD</text>
<text x="74" y="281" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Card Number</text>
<rect x="560" y="74" width="200" height="78" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="660.0" y="96" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CUSTOMER</text>
<text x="574" y="118" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># Customer ID</text>
<text x="574" y="137" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Name</text>
<path d="M300 113 L430 113" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M430 113 L560 113" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M312 113 L300 106" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M312 113 L300 113" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M312 113 L300 120" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="318" y="106" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">made by</text>
<text x="552" y="106" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">make</text>
<g class="en"><text x="170" y="341" text-anchor="middle" style="fill:var(--dg-bad, var(--text));font-family:var(--font, sans-serif);font-size:12px;font-weight:600">CASH inherits the line too</text></g><g class="ar"><text x="170" y="341" text-anchor="middle" direction="rtl" style="fill:var(--dg-bad, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px;font-weight:600">CASH يرث الخطّ أيضًا</text></g>
<rect x="40" y="356" width="720" height="84" rx="6" style="fill:var(--dg-bad-soft, var(--surface));stroke:var(--dg-bad, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="379" text-anchor="start" style="fill:var(--dg-bad, var(--text));font-family:var(--font, sans-serif);font-size:12px">Drawn on PAYMENT, the rule holds for every subtype: Each CASH must be made by one and only one CUSTOMER.</text></g><g class="ar"><text x="744" y="379" text-anchor="start" direction="rtl" style="fill:var(--dg-bad, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">مرسومةً على PAYMENT، تنطبق القاعدة على كل نوع فرعي: فكل CASH يجب أن يقوم به زبون واحد فقط.</text></g>
<g class="en"><text x="56" y="399" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">But the business never records who paid in cash. The line belongs on CHECK and CREDIT CARD.</text></g><g class="ar"><text x="744" y="399" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">لكن العمل لا يسجّل أبدًا مَن دفع نقدًا. فمكان الخطّ هو CHECK وCREDIT CARD.</text></g>
<g class="en"><text x="56" y="419" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Only what is true of every kind may be drawn on the supertype.</text></g><g class="ar"><text x="744" y="419" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">لا يُرسم على النوع الأعلى إلا ما يصدق على كل الأنواع.</text></g>
</svg>
