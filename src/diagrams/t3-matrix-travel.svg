<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" direction="ltr" role="img" aria-labelledby="t3-matrix-travel-t">
<title id="t3-matrix-travel-t">The travel agency's relationship matrix: TRAVELER, COUNTRY and LANDMARK on both axes, every cell read row entity, name, column entity / مصفوفة علاقات وكالة السفر: TRAVELER وCOUNTRY وLANDMARK على المحورين، وكل خلية تُقرأ: كيان الصف ثم الاسم ثم كيان العمود</title>
<g class="en"><text x="390.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">The travel agency's matrix, filled in one direction</text></g><g class="ar"><text x="390.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">مصفوفة وكالة السفر، مملوءة في اتجاه واحد</text></g>
<rect x="40" y="44" width="160" height="40" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-line, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="120.0" y="61" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:10.5px">row ↓  column →</text></g><g class="ar"><text x="120.0" y="61" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:11.5px">الصف ↓  العمود ←</text></g>
<g class="en"><text x="120.0" y="76" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:10px">(read row first)</text></g><g class="ar"><text x="120.0" y="76" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:11px">(الصف يُقرأ أوّلًا)</text></g>
<rect x="200" y="44" width="180" height="40" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-line, var(--text-soft));stroke-width:1"/>
<text x="290.0" y="69" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px;font-weight:700">TRAVELER</text>
<rect x="380" y="44" width="180" height="40" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-line, var(--text-soft));stroke-width:1"/>
<text x="470.0" y="69" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px;font-weight:700">COUNTRY</text>
<rect x="560" y="44" width="180" height="40" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-line, var(--text-soft));stroke-width:1"/>
<text x="650.0" y="69" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px;font-weight:700">LANDMARK</text>
<rect x="40" y="84" width="160" height="40" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-line, var(--text-soft));stroke-width:1"/>
<text x="52" y="109" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px;font-weight:700">TRAVELER</text>
