<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" direction="ltr" role="img" aria-labelledby="t2-instance-counts-t">
<title id="t2-instance-counts-t">LIBRARY has one instance and is not an entity; PUBLISHER has a few instances; BOOK has many / LIBRARY له نسخة واحدة فليس كيانًا، وPUBLISHER له نُسخ قليلة، وBOOK له نُسخ كثيرة</title>
<g class="en"><text x="450" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">How many instances? Many, a few — but never just one</text></g><g class="ar"><text x="450" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">كم نسخة؟ كثيرة أو قليلة — لكن ليست واحدة فقط</text></g>
<rect x="30" y="56" width="240" height="56" rx="10" style="fill:var(--dg-bad-soft, var(--bad-soft));stroke:var(--dg-bad, var(--bad));stroke-width:1.5"/><text x="150" y="89" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">LIBRARY</text>
<path d="M150 112 L150 132" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.2;fill:none;stroke-dasharray:2 3"/>
<rect x="50" y="132" width="200" height="28" rx="3" style="fill:var(--dg-bad-soft, var(--bad-soft));stroke:var(--dg-bad, var(--bad));stroke-width:1.4"/><text x="150.0" y="150.5" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">School Library</text>
<rect x="330" y="56" width="240" height="56" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/><text x="450.0" y="89.0" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">PUBLISHER</text>
<path d="M450 112 L450 132" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.2;fill:none;stroke-dasharray:2 3"/>
<path d="M450 112 L450 170" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.2;fill:none;stroke-dasharray:2 3"/>
<rect x="350" y="132" width="200" height="28" rx="3" style="fill:var(--dg-alt-fill, var(--surface-2));stroke:var(--dg-alt-stroke, var(--text-soft));stroke-width:1"/><text x="450.0" y="150.5" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Riwaq Press</text>
<rect x="350" y="170" width="200" height="28" rx="3" style="fill:var(--dg-alt-fill, var(--surface-2));stroke:var(--dg-alt-stroke, var(--text-soft));stroke-width:1"/><text x="450.0" y="188.5" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Al-Manara Books</text>
<rect x="630" y="56" width="240" height="56" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/><text x="750.0" y="89.0" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">BOOK</text>
<path d="M750 112 L750 132" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.2;fill:none;stroke-dasharray:2 3"/>
<path d="M750 112 L750 170" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.2;fill:none;stroke-dasharray:2 3"/>
<path d="M750 112 L750 208" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.2;fill:none;stroke-dasharray:2 3"/>
<path d="M750 112 L750 246" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.2;fill:none;stroke-dasharray:2 3"/>
<rect x="650" y="132" width="200" height="28" rx="3" style="fill:var(--dg-alt-fill, var(--surface-2));stroke:var(--dg-alt-stroke, var(--text-soft));stroke-width:1"/><text x="750.0" y="150.5" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">A Vision</text>
<rect x="650" y="170" width="200" height="28" rx="3" style="fill:var(--dg-alt-fill, var(--surface-2));stroke:var(--dg-alt-stroke, var(--text-soft));stroke-width:1"/><text x="750.0" y="188.5" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">War and Peace</text>
<rect x="650" y="208" width="200" height="28" rx="3" style="fill:var(--dg-alt-fill, var(--surface-2));stroke:var(--dg-alt-stroke, var(--text-soft));stroke-width:1"/><text x="750.0" y="226.5" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Citizen of the World</text>
<rect x="650" y="246" width="200" height="28" rx="3" style="fill:var(--dg-alt-fill, var(--surface-2));stroke:var(--dg-alt-stroke, var(--text-soft));stroke-width:1"/><text x="750.0" y="264.5" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Androcles and the Lion</text>
<g class="en"><text x="150" y="300" text-anchor="middle" style="fill:var(--dg-bad, var(--bad));font-family:var(--font, sans-serif);font-size:12px;font-weight:600">1 instance — nothing to list</text></g><g class="ar"><text x="150" y="300" text-anchor="middle" direction="rtl" style="fill:var(--dg-bad, var(--bad));font-family:var(--font-ar, sans-serif);font-size:13px;font-weight:600">نسخة واحدة — لا شيء لتسرده</text></g>
<g class="en"><text x="450" y="300" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">a few instances</text></g><g class="ar"><text x="450" y="300" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">نُسخ قليلة</text></g>
<g class="en"><text x="750" y="300" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">many instances, and growing</text></g><g class="ar"><text x="750" y="300" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">نُسخ كثيرة، وتزداد</text></g>
<g class="en"><text x="150" y="190" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">the whole database is</text></g><g class="ar"><text x="150" y="190" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">قاعدة البيانات كلّها</text></g>
<g class="en"><text x="150" y="208" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">about this one library</text></g><g class="ar"><text x="150" y="208" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">عن هذه المكتبة الواحدة</text></g>
</svg>
