<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" direction="ltr" role="img" aria-labelledby="t3-erdish-rec-v2-t">
<title id="t3-erdish-rec-v2-t">Version 2: the recursive EMPLOYEE relationship with the crow's foot at the managed by end; each ERDish sentence starts at one end's name and takes its cardinality from the other end / الإصدار 2: العلاقة الذاتية على EMPLOYEE وقدم الغراب عند طرف managed by؛ تبدأ كل جملة ERDish من اسم طرف وتأخذ تعدّديتها من الطرف الآخر</title>
<g class="en"><text x="390.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 2 — the crow's foot beside managed by</text></g><g class="ar"><text x="390.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">الإصدار 2 — قدم الغراب بجانب managed by</text></g>
<rect x="60" y="46" width="220" height="95" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="170.0" y="68" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">EMPLOYEE</text>
<text x="74" y="90" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Employee ID</text>
<text x="74" y="109" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* First Name</text>
<text x="74" y="128" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Last Name</text>
<path d="M120 141 L120 197 L170 197" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M170 197 L220 197 L220 141" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M120 155 L112 141" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M120 155 L120 141" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M120 155 L128 141" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="112" y="171" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">managed by</text>
<text x="228" y="171" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">manager of</text>
<g class="en"><text x="120" y="219" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:10.5px">start: name here</text></g><g class="ar"><text x="120" y="219" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:11.5px">البداية: الاسم هنا</text></g>
<g class="en"><text x="220" y="219" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:10.5px">end: symbol here</text></g><g class="ar"><text x="220" y="219" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:11.5px">النهاية: الرمز هنا</text></g>
<rect x="330" y="56" width="410" height="136" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="346" y="78" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:11.5px">From the managed by end:</text></g><g class="ar"><text x="724" y="78" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:12.5px">من طرف managed by:</text></g>
<text x="346" y="98" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">1 EACH 2 EMPLOYEE 3 MAY BE 4 MANAGED BY</text>
<text x="346" y="116" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">5 ONE AND ONLY ONE 6 EMPLOYEE</text>
<g class="en"><text x="346" y="144" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:11.5px">From the manager of end:</text></g><g class="ar"><text x="724" y="144" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:12.5px">من طرف manager of:</text></g>
<text x="346" y="164" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">1 EACH 2 EMPLOYEE 3 MAY BE 4 THE MANAGER OF</text>
<text x="346" y="182" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">5 ONE OR MORE 6 EMPLOYEEs</text>
<rect x="40" y="250" width="700" height="76" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="274" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Both dashed: Dana has no manager above her, and Tyler manages nobody.</text></g><g class="ar"><text x="724" y="274" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">كلا النصفين متقطّع: لا مدير فوق Dana، وTyler لا يدير أحدًا.</text></g>
<g class="en"><text x="56" y="298" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Crow's foot beside managed by: many employees can point at one manager.</text></g><g class="ar"><text x="724" y="298" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">قدم الغراب بجانب managed by: كثير من الموظّفين يمكن أن يشيروا إلى مدير واحد.</text></g>
<g class="en"><text x="56" y="316" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Entity A and entity B are the same entity; the names tell the two readings apart.</text></g><g class="ar"><text x="724" y="316" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">الكيان A والكيان B كيان واحد؛ والاسمان هما ما يميّز القراءتين.</text></g>
</svg>
