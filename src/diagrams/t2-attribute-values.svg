<g class="en"><text x="450" y="279" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:11.5px">Left: the attributes, the same for every member. Middle: values, one per attribute, different for every member.</text></g><g class="ar"><text x="450" y="279" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:12.5px">يسارًا: الخصائص، وهي نفسها لكل عضو. وفي الوسط: القيم، واحدة لكل خاصية، وتختلف من عضو لآخر.</text></g>
