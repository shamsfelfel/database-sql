<text x="464" y="123" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">Omar</text>
<rect x="456" y="129" width="148" height="17" rx="3" style="fill:var(--dg-warn-soft, var(--warn-soft));stroke:var(--dg-warn, var(--warn));stroke-width:2"/>
<text x="464" y="142" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">Saleh</text>
