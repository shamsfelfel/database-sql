<text x="464" y="161" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">Khan Younis</text>
<g class="en"><text x="640" y="104" text-anchor="start" style="fill:var(--dg-good, var(--good));font-family:var(--font, sans-serif);font-size:12px;font-weight:600">differs — picks one member</text></g><g class="ar"><text x="800" y="104" text-anchor="start" direction="rtl" style="fill:var(--dg-good, var(--good));font-family:var(--font-ar, sans-serif);font-size:13px;font-weight:600">مختلفة — تختار عضوًا واحدًا</text></g>
<g class="en"><text x="640" y="123" text-anchor="start" style="fill:var(--dg-warn, var(--warn));font-family:var(--font, sans-serif);font-size:12px">the same for both</text></g><g class="ar"><text x="800" y="123" text-anchor="start" direction="rtl" style="fill:var(--dg-warn, var(--warn));font-family:var(--font-ar, sans-serif);font-size:13px">متطابقة عند الاثنين</text></g>
<g class="en"><text x="640" y="142" text-anchor="start" style="fill:var(--dg-warn, var(--warn));font-family:var(--font, sans-serif);font-size:12px">the same for both</text></g><g class="ar"><text x="800" y="142" text-anchor="start" direction="rtl" style="fill:var(--dg-warn, var(--warn));font-family:var(--font-ar, sans-serif);font-size:13px">متطابقة عند الاثنين</text></g>
<g class="en"><text x="640" y="161" text-anchor="start" style="fill:var(--dg-warn, var(--warn));font-family:var(--font, sans-serif);font-size:12px">the same for both</text></g><g class="ar"><text x="800" y="161" text-anchor="start" direction="rtl" style="fill:var(--dg-warn, var(--warn));font-family:var(--font-ar, sans-serif);font-size:13px">متطابقة عند الاثنين</text></g>
<rect x="30" y="200" width="770" height="64" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="46" y="226" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12.5px">Name and city together still match two members. Only # Id answers “which one?”.</text></g><g class="ar"><text x="784" y="226" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13.5px">الاسم والمدينة معًا ما زالا يطابقان عضوين. وحدها # Id تجيب عن «أيّهما؟».</text></g>
<g class="en"><text x="46" y="248" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12.5px">The # mark says: this attribute is the unique identifier (UID) of MEMBER.</text></g><g class="ar"><text x="784" y="248" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13.5px">العلامة # تقول: هذه الخاصية هي المعرّف الفريد (UID) للكيان MEMBER.</text></g>
</svg>
