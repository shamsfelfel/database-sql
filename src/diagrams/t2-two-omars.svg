<rect x="450" y="60" width="160" height="116" rx="4" style="fill:var(--dg-alt-fill, var(--surface-2));stroke:var(--dg-alt-stroke, var(--text-soft));stroke-width:1.4"/>
<g class="en"><text x="530" y="82" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px;font-weight:700">instance 2</text></g><g class="ar"><text x="530" y="82" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px;font-weight:700">النسخة 2</text></g>
<rect x="456" y="91" width="148" height="17" rx="3" style="fill:var(--dg-good-soft, var(--good-soft));stroke:var(--dg-good, var(--good));stroke-width:2"/>
