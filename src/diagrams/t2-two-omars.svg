<g class="en"><text x="350" y="82" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px;font-weight:700">instance 1</text></g><g class="ar"><text x="350" y="82" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px;font-weight:700">النسخة 1</text></g>
<rect x="276" y="91" width="148" height="17" rx="3" style="fill:var(--dg-good-soft, var(--good-soft));stroke:var(--dg-good, var(--good));stroke-width:2"/>
