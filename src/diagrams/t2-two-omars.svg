<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 280" direction="ltr" role="img" aria-labelledby="t2-two-omars-t">
<title id="t2-two-omars-t">Two members called Omar Saleh in Khan Younis: only Id tells them apart / عضوان اسم كلٍّ منهما Omar Saleh في خان يونس: وحدها Id تميّز بينهما</title>
<g class="en"><text x="415.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Two Omar Salehs — which attribute tells them apart?</text></g><g class="ar"><text x="415.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">عُمَرا Omar Saleh — أيّ خاصية تميّز بينهما؟</text></g>
<rect x="30" y="60" width="190" height="116" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="125.0" y="82" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">MEMBER</text>
<text x="44" y="104" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Id</text>
