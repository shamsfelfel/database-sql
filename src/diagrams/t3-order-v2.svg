<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 296" direction="ltr" role="img" aria-labelledby="t3-order-v2-t">
<title id="t3-order-v2-t">Version 2: CUSTOMER place / placed by ORDER, solid at the ORDER half and dashed at the CUSTOMER half: every order has its customer / الإصدار 2: علاقة CUSTOMER place / placed by ORDER، متّصلة في نصف ORDER ومتقطّعة في نصف CUSTOMER: لكل طلب زبونه</title>
<g class="en"><text x="390.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 2 — the ORDER half made solid</text></g><g class="ar"><text x="390.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">الإصدار 2 — نصف ORDER صار متّصلًا</text></g>
<rect x="40" y="50" width="200" height="80" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="140.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CUSTOMER</text>
<text x="54" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Customer ID</text>
<text x="54" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Name</text>
<rect x="540" y="50" width="200" height="61" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="640.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">ORDER</text>
<text x="554" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Order No</text>
<path d="M240 94 L390.0 94" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M390.0 94 L540 94" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M526 94 L540 86" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M526 94 L540 94" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M526 94 L540 102" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="248" y="86" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">place</text>
<text x="520" y="112" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">placed by</text>
<g class="en"><text x="315" y="132" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11px">dashed: may</text></g><g class="ar"><text x="315" y="132" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12px">متقطّع: قد</text></g>
<g class="en"><text x="465" y="132" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11px">solid: must</text></g><g class="ar"><text x="465" y="132" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12px">متّصل: يجب</text></g>
<rect x="40" y="160" width="700" height="58" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<text x="56" y="183" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each CUSTOMER may place one or more ORDERs.</text>
<text x="56" y="204" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each ORDER must be placed by one and only one CUSTOMER.</text>
<rect x="40" y="232" width="700" height="50" rx="6" style="fill:var(--dg-bad-soft, var(--surface));stroke:var(--dg-bad, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="253" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Fixed: every order has its one customer. Still open: a CUSTOMER who never ordered.</text></g><g class="ar"><text x="724" y="253" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">أُصلح: لكل طلب زبونه الواحد. وما زال مفتوحًا: CUSTOMER لم يطلب شيئًا قطّ.</text></g>
<g class="en"><text x="56" y="272" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">The slides say a customer is someone who places an order: must, at that end too.</text></g><g class="ar"><text x="724" y="272" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">تقول الشرائح إن الزبون هو مَن يضع طلبًا: «يجب» عند ذلك الطرف أيضًا.</text></g></svg>
