<g class="en"><text x="56" y="313" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">A card number exists only for card payments. A paying customer is recorded only for cheques and cards.</text></g><g class="ar"><text x="844" y="313" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">رقم البطاقة لا يوجد إلا في الدفع بالبطاقة، والزبون الذي دفع لا يُسجَّل إلا في الشيك والبطاقة.</text></g>
<g class="en"><text x="56" y="333" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Shaded cells are not unknown values: the attribute or relationship does not apply to that kind of payment.</text></g><g class="ar"><text x="844" y="333" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">الخلايا المظلّلة ليست قيمًا مجهولة: فالخاصية أو العلاقة لا تنطبق على هذا النوع من الدفع أصلًا.</text></g>
<g class="en"><text x="56" y="353" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">The last two facts are true of only a group of instances. That is the signal this chapter is about.</text></g><g class="ar"><text x="844" y="353" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">الحقيقتان الأخيرتان لا تصدقان إلا على مجموعة من النُّسَخ. وهذه هي الإشارة التي يدور حولها الفصل.</text></g>
