<text x="56" y="394" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each CUSTOMER must place one or more ORDERs.</text>
<text x="56" y="413" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each ORDER must be placed by one and only one CUSTOMER.</text>
<text x="56" y="432" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each ORDER must be issued for one or more ITEMs.</text>
<text x="56" y="451" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each ITEM may be contained on one or more ORDERs.</text>
<text x="56" y="470" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each ITEM must be stored in one and only one WAREHOUSE.</text>
<text x="56" y="489" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each WAREHOUSE may store one or more ITEMs.</text>
