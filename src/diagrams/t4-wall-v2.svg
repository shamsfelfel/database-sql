<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" direction="ltr" role="img" aria-labelledby="t4-wall-v2-t">
<title id="t4-wall-v2-t">WALL COVERING with PAINT, WALLPAPER, FABRIC and OTHER: every instance, the tile and the wood panel included, has a subtype / WALL COVERING وفيه PAINT وWALLPAPER وFABRIC وOTHER: لكل نسخة نوع فرعي، ومنها البلاط واللوح الخشبي</title>
<g class="en"><text x="400.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 2 — an OTHER subtype makes the set exhaustive</text></g><g class="ar"><text x="400.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">الإصدار 2 — النوع الفرعي OTHER يجعل المجموعة شاملة</text></g>
<rect x="40" y="50" width="280" height="348" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="180.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">WALL COVERING</text>
<text x="54" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># Code</text>
<text x="54" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Description</text>
<text x="54" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Price</text>
<rect x="60" y="147" width="240" height="55" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="180.0" y="168" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">PAINT</text>
<text x="74" y="189" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Litres</text>
<rect x="60" y="214" width="240" height="55" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="180.0" y="235" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">WALLPAPER</text>
<text x="74" y="256" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Roll Length</text>
<rect x="60" y="281" width="240" height="55" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="180.0" y="302" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">FABRIC</text>
<text x="74" y="323" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Material</text>
<rect x="60" y="348" width="240" height="30" rx="10" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:2"/>
<text x="180.0" y="369" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">OTHER</text>
<g class="en"><text x="420" y="66" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px;font-weight:600">The store's five products</text></g><g class="ar"><text x="760" y="66" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px;font-weight:600">منتجات المتجر الخمسة</text></g>
<rect x="420" y="80" width="340" height="26" rx="6" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="432" y="98" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">WC1  Matt white emulsion</text>
<text x="748" y="98" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px;font-weight:700">→ PAINT</text>
<rect x="420" y="114" width="340" height="26" rx="6" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="432" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">WC2  Striped wallpaper</text>
<text x="748" y="132" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px;font-weight:700">→ WALLPAPER</text>
<rect x="420" y="148" width="340" height="26" rx="6" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="432" y="166" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">WC3  Linen wall panel</text>
<text x="748" y="166" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px;font-weight:700">→ FABRIC</text>
<rect x="420" y="182" width="340" height="26" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:2"/>
<text x="432" y="200" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">WC4  Ceramic wall tile</text>
<text x="748" y="200" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px;font-weight:700">→ OTHER</text>
<rect x="420" y="216" width="340" height="26" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:2"/>
<text x="432" y="234" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">WC5  Oak wood panel</text>
<text x="748" y="234" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px;font-weight:700">→ OTHER</text>
<rect x="40" y="418" width="720" height="82" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:2"/>
<g class="en"><text x="56" y="441" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Every WALL COVERING now fits a subtype: the OTHER box takes the rest.</text></g><g class="ar"><text x="744" y="441" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">صار لكل WALL COVERING نوع فرعي: فالصندوق OTHER يأخذ الباقي.</text></g>
<g class="en"><text x="56" y="461" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Rule two holds: the subtypes are exhaustive.</text></g><g class="ar"><text x="744" y="461" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">القاعدة الثانية متحقّقة: الأنواع الفرعية شاملة.</text></g>
<g class="en"><text x="56" y="481" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">OTHER lists nothing of its own; it still inherits # Code, * Description, * Price.</text></g><g class="ar"><text x="744" y="481" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">لا يذكر OTHER شيئًا خاصًّا به، لكنه يرث # Code و* Description و* Price.</text></g>
</svg>
