<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" direction="ltr" role="img" aria-labelledby="t3-conv-names-v1-t">
<title id="t3-conv-names-v1-t">Version 1: three entities drawn by three habits - a square box named Employees, a softbox named dept., an oval named Job Titles / الإصدار 1: ثلاثة كيانات رُسمت بثلاث عادات - صندوق مربّع اسمه Employees، وصندوق مستدير اسمه dept.، وشكل بيضوي اسمه Job Titles</title>
<g class="en"><text x="450.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 1 — every box drawn its own way</text></g><g class="ar"><text x="450.0" y="24" text-anchor="middle" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">الإصدار 1 — كل صندوق مرسوم على طريقته</text></g>
<rect x="60" y="60" width="200" height="40" rx="0" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="160" y="85" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">Employees</text>
<rect x="350" y="60" width="200" height="40" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="450" y="85" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">dept.</text>
<ellipse cx="740" cy="80" rx="110" ry="24" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="740" y="85" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">Job Titles</text>
<g class="en"><text x="160" y="124" text-anchor="middle" style="fill:var(--dg-bad, var(--text));font-family:var(--font, sans-serif);font-size:11.5px">square corners · plural</text></g><g class="ar"><text x="160" y="124" text-anchor="middle" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-bad, var(--text));font-family:var(--font-ar, sans-serif);font-size:12.5px">زوايا حادّة · جمع</text></g>
<g class="en"><text x="450" y="124" text-anchor="middle" style="fill:var(--dg-bad, var(--text));font-family:var(--font, sans-serif);font-size:11.5px">abbreviated · lowercase</text></g><g class="ar"><text x="450" y="124" text-anchor="middle" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-bad, var(--text));font-family:var(--font-ar, sans-serif);font-size:12.5px">اسم مختصر · أحرف صغيرة</text></g>
<g class="en"><text x="740" y="124" text-anchor="middle" style="fill:var(--dg-bad, var(--text));font-family:var(--font, sans-serif);font-size:11.5px">oval · plural · mixed case</text></g><g class="ar"><text x="740" y="124" text-anchor="middle" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-bad, var(--text));font-family:var(--font-ar, sans-serif);font-size:12.5px">شكل بيضوي · جمع · أحرف مختلطة</text></g>
<rect x="40" y="150" width="820" height="56" rx="6" style="fill:var(--dg-bad-soft, var(--surface));stroke:var(--dg-bad, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="173" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Is Employees one employee or the whole list? Is dept. a department or a deputy? Is an oval an entity at all?</text></g><g class="ar"><text x="844" y="173" text-anchor="start" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">هل Employees موظّف واحد أم القائمة كلها؟ وهل dept. قسم أم شيء آخر؟ وهل الشكل البيضوي كيان أصلًا؟</text></g>
<g class="en"><text x="56" y="193" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Every reader has to ask the author. That is the cost of a private convention.</text></g><g class="ar"><text x="844" y="193" text-anchor="start" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">على كل قارئ أن يسأل المؤلّف. هذا هو ثمن العُرف الخاص.</text></g>
</svg>
