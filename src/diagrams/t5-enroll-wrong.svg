<path d="M646 95 L660 103" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="528" y="85" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">for</text>
<text x="640" y="115" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">subject of</text>
