<rect x="20" y="176" width="820" height="56" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<text x="36" y="200" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each ENROLLMENT must be for one or more STUDENTs.</text>
<text x="36" y="221" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each ENROLLMENT must be for one or more SUBJECTs.</text>
<rect x="20" y="246" width="820" height="54" rx="6" style="fill:var(--dg-bad-soft, var(--surface));stroke:var(--dg-bad, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="36" y="268" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">The crow's feet stayed at the parents. One enrollment now holds many students and many subjects,</text></g><g class="ar"><text x="824" y="268" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‏بقيت رِجلا الغراب عند الأبوين. فالتسجيل الواحد يحمل الآن طلابًا كثيرين وموادّ كثيرة،</text></g>
<g class="en"><text x="36" y="287" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">so its Grade is again one value for a crowd, not for one student in one subject.</text></g><g class="ar"><text x="824" y="287" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏فتعود درجته قيمةً واحدة لجمعٍ، لا لطالب واحد في مادة واحدة.</text></g>
</svg>