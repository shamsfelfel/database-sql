<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" direction="ltr" role="img" aria-labelledby="t5-enroll-wrong-t">
<title id="t5-enroll-wrong-t">Version 2: ENROLLMENT added between STUDENT and SUBJECT, but the crow's feet are drawn at STUDENT and SUBJECT, so each enrollment would be for many students and many subjects / الإصدار 2: أُضيف ENROLLMENT بين STUDENT وSUBJECT، لكن رِجلَي الغراب رُسمتا عند STUDENT وSUBJECT، فيصير التسجيل الواحد لطلاب كثيرين ومواد كثيرة</title>
<g class="en"><text x="430.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 2 — a box in the middle, the feet in the wrong place</text></g><g class="ar"><text x="430.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">‏الإصدار 2 — صندوق في الوسط، والأرجل في المكان الخطأ</text></g>
<rect x="20" y="50" width="180" height="99" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="110.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">STUDENT</text>
