<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" direction="ltr" role="img" aria-labelledby="t3-manager-v1-t">
<title id="t3-manager-v1-t">Version 1: a separate MANAGER entity whose attributes repeat EMPLOYEE's / الإصدار 1: كيان MANAGER منفصل تكرّر خصائصه خصائص EMPLOYEE</title>
<g class="en"><text x="400.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 1 — MANAGER as a second entity</text></g><g class="ar"><text x="400.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">الإصدار 1 — MANAGER كيانًا ثانيًا</text></g>
<rect x="40" y="50" width="210" height="133" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="145.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">EMPLOYEE</text>
<text x="54" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Employee ID</text>
<text x="54" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* First Name</text>
<text x="54" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Last Name</text>
<text x="54" y="151" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Hire Date</text>
<text x="54" y="170" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Salary</text>
<rect x="550" y="50" width="210" height="133" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<rect x="556" y="100" width="198" height="17" rx="3" style="fill:var(--dg-warn-soft, var(--warn-soft))"/>
<rect x="556" y="119" width="198" height="17" rx="3" style="fill:var(--dg-warn-soft, var(--warn-soft))"/>
<rect x="556" y="138" width="198" height="17" rx="3" style="fill:var(--dg-warn-soft, var(--warn-soft))"/>
<rect x="556" y="157" width="198" height="17" rx="3" style="fill:var(--dg-warn-soft, var(--warn-soft))"/>
<text x="655.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">MANAGER</text>
<text x="564" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Manager ID</text>
<text x="564" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* First Name</text>
<text x="564" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Last Name</text>
<text x="564" y="151" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Hire Date</text>
<text x="564" y="170" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Salary</text>
<path d="M250 120 L400.0 120" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M400.0 120 L550 120" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M264 120 L250 112" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M264 120 L250 120" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M264 120 L250 128" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="270" y="112" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">managed by</text>
<text x="540" y="138" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">manager of</text>
<rect x="40" y="200" width="720" height="84" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="224" text-anchor="start" style="fill:var(--dg-bad, var(--bad));font-family:var(--font, sans-serif);font-size:12.5px;font-weight:600">Defect: a manager is an employee. Dana Smith (100) is stored once in each box.</text></g><g class="ar"><text x="744" y="224" text-anchor="start" direction="rtl" style="fill:var(--dg-bad, var(--bad));font-family:var(--font-ar, sans-serif);font-size:13.5px;font-weight:600">العيب: المدير موظّف. Dana Smith ‏(100) مخزّنة مرّة في كل صندوق.</text></g>
<g class="en"><text x="56" y="248" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Give Dana a raise and two Salary values must change; miss one and they disagree.</text></g><g class="ar"><text x="744" y="248" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">إن رُفع راتب Dana وجب أن تتغيّر قيمتان لـ Salary؛ وإن فاتتك واحدة تعارضتا.</text></g>
<g class="en"><text x="56" y="270" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">And who manages a manager? Lawrence Chen is managed, and manages Carlos.</text></g><g class="ar"><text x="744" y="270" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">ومَن يدير المدير؟ Lawrence Chen يُدار، ويدير Carlos.</text></g>
</svg>
