<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 516" direction="ltr" role="img" aria-labelledby="t4-pay-three-t">
<title id="t4-pay-three-t">Three separate entities CASH, CHECK and CREDIT CARD, each repeating Payment ID, Payment Date and Amount; CHECK and CREDIT CARD each have their own relationship to CUSTOMER / ثلاثة كيانات منفصلة CASH وCHECK وCREDIT CARD، يكرّر كلٌّ منها Payment ID وPayment Date وAmount؛ ولكلٍّ من CHECK وCREDIT CARD علاقته الخاصة مع CUSTOMER</title>
<g class="en"><text x="400.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Three separate entities</text></g><g class="ar"><text x="400.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">ثلاثة كيانات منفصلة</text></g>
<rect x="40" y="46" width="240" height="97" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="160.0" y="68" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CASH</text>
<text x="54" y="90" text-anchor="start" style="fill:var(--dg-bad, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># Payment ID</text>
<text x="54" y="109" text-anchor="start" style="fill:var(--dg-bad, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Payment Date</text>
<text x="54" y="128" text-anchor="start" style="fill:var(--dg-bad, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Amount</text>
<rect x="40" y="168" width="240" height="97" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="160.0" y="190" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CHECK</text>
<text x="54" y="212" text-anchor="start" style="fill:var(--dg-bad, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># Payment ID</text>
<text x="54" y="231" text-anchor="start" style="fill:var(--dg-bad, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Payment Date</text>
<text x="54" y="250" text-anchor="start" style="fill:var(--dg-bad, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Amount</text>
<rect x="40" y="290" width="240" height="116" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="160.0" y="312" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CREDIT CARD</text>
<text x="54" y="334" text-anchor="start" style="fill:var(--dg-bad, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># Payment ID</text>
<text x="54" y="353" text-anchor="start" style="fill:var(--dg-bad, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Payment Date</text>
<text x="54" y="372" text-anchor="start" style="fill:var(--dg-bad, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Amount</text>
<text x="54" y="391" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Card Number</text>
<rect x="540" y="220" width="220" height="78" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="650.0" y="242" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CUSTOMER</text>
<text x="554" y="264" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># Customer ID</text>
<text x="554" y="283" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Name</text>
<path d="M280 222 L410 222" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M410 222 L410 250 L540 250" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M294 222 L280 214" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M294 222 L280 222" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M294 222 L280 230" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="300" y="214" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">made by</text>
<text x="532" y="242" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">make</text>
<path d="M280 344 L410 344" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M410 344 L410 290 L540 290" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M294 344 L280 336" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M294 344 L280 344" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M294 344 L280 352" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="300" y="362" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">made by</text>
<text x="532" y="308" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">make</text>
<rect x="40" y="428" width="720" height="74" rx="6" style="fill:var(--dg-bad-soft, var(--surface));stroke:var(--dg-bad, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="451" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Each kind now states its own rules: * Card Number is mandatory, and the CHECK half is solid.</text></g><g class="ar"><text x="744" y="451" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">صار كل نوع يقول قواعده: رقم البطاقة إلزامي، والنصف المجاور لـ CHECK متّصل.</text></g>
<g class="en"><text x="56" y="471" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Defect: repetition. The three common attributes are drawn three times (in red), the customer line</text></g><g class="ar"><text x="744" y="471" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">العيب: التكرار. الخصائص المشتركة الثلاث مرسومة ثلاث مرّات (بالأحمر)، وخط الزبون</text></g>
<g class="en"><text x="56" y="491" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">twice, and nothing in the model says a cheque and a card payment are both payments.</text></g><g class="ar"><text x="744" y="491" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">مرّتين، ولا شيء في النموذج يقول إن الشيك والدفع بالبطاقة كليهما دفعة.</text></g>
</svg>
