<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 320" direction="ltr" role="img" aria-labelledby="t2-hr-v2-t">
<title id="t2-hr-v2-t">HR version 2: EMPLOYEE and DEPARTMENT as two entities joined by works in / responsible for / الموارد البشرية، الإصدار 2: EMPLOYEE وDEPARTMENT كيانان يربطهما works in / responsible for</title>
<g class="en"><text x="415.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 2 — the department becomes an entity</text></g><g class="ar"><text x="415.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">الإصدار 2 — القسم يصبح كيانًا</text></g>
<rect x="30" y="56" width="230" height="192" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="145.0" y="78" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">EMPLOYEE</text>
<text x="44" y="100" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Employee ID</text>
<text x="44" y="119" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* First Name</text>
<text x="44" y="138" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Last Name</text>
<rect x="36" y="144" width="218" height="17" rx="3" style="fill:var(--dg-warn-soft, var(--warn-soft))"/>
<text x="44" y="157" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Job</text>
<text x="44" y="176" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Hire Date</text>
<text x="44" y="195" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Salary</text>
<text x="44" y="214" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">o Commission</text>
<rect x="36" y="220" width="218" height="17" rx="3" style="fill:var(--dg-warn-soft, var(--warn-soft))"/>
<text x="44" y="233" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">o Manager Name</text>
<rect x="520" y="56" width="230" height="97" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="635.0" y="78" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">DEPARTMENT</text>
<text x="534" y="100" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># * Department ID</text>
<text x="534" y="119" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Name</text>
<rect x="526" y="125" width="218" height="17" rx="3" style="fill:var(--dg-warn-soft, var(--warn-soft))"/>
<text x="534" y="138" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Location</text>
<path d="M260 120 L390 120" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M390 120 L520 120" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M274 120 L260 112" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M274 120 L260 120" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M274 120 L260 128" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="282" y="112" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">works in</text>
<text x="508" y="138" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">responsible for</text>
<rect x="300" y="230" width="500" height="74" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="314" y="254" text-anchor="start" style="fill:var(--dg-good, var(--good));font-family:var(--font, sans-serif);font-size:12.5px;font-weight:600">Fixed: Accounting is one DEPARTMENT instance, stored once.</text></g><g class="ar"><text x="786" y="254" text-anchor="start" direction="rtl" style="fill:var(--dg-good, var(--good));font-family:var(--font-ar, sans-serif);font-size:13.5px;font-weight:600">أُصلح: Accounting نسخة واحدة من DEPARTMENT، تُخزَّن مرّة واحدة.</text></g>
<g class="en"><text x="314" y="274" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12.5px">Still open: Job, Manager Name and Location</text></g><g class="ar"><text x="786" y="274" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13.5px">ما زال مفتوحًا: Job وManager Name وLocation</text></g>
<g class="en"><text x="314" y="292" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12.5px">each describe something the model does not have yet.</text></g><g class="ar"><text x="786" y="292" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13.5px">كلٌّ منها يصف شيئًا لا يملكه النموذج بعد.</text></g>
</svg>
