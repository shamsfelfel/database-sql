<text x="80.0" y="172" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">A</text>
<rect x="360" y="150" width="80" height="34" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="400.0" y="172" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">B</text>
<path d="M120 167 L240.0 167" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M240.0 167 L360 167" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;opacity:0.35"/>
<g class="en"><text x="180" y="159" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11.5px;font-weight:600">may</text></g><g class="ar"><text x="180" y="159" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12.5px;font-weight:600">قد</text></g>
<g class="en"><text x="540" y="165" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:700">zero or one</text></g><g class="ar"><text x="540" y="165" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:700">صفر أو واحد</text></g>
<text x="540" y="183" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--mono, monospace);font-size:11px">min 0 · max 1</text>
<text x="620" y="165" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">Each EMPLOYEE may be managed by</text>
<text x="620" y="183" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">one and only one EMPLOYEE.</text>
<rect x="40" y="224" width="80" height="34" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="80.0" y="246" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">A</text>
<rect x="360" y="224" width="80" height="34" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="400.0" y="246" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">B</text>
<path d="M120 241 L240.0 241" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M240.0 241 L360 241" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;opacity:0.35"/>
<path d="M346 241 L360 233" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M346 241 L360 241" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M346 241 L360 249" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M346 241 L360 241" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<g class="en"><text x="180" y="233" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11.5px;font-weight:600">must</text></g><g class="ar"><text x="180" y="233" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12.5px;font-weight:600">يجب</text></g>
<g class="en"><text x="540" y="239" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:700">one or more</text></g><g class="ar"><text x="540" y="239" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:700">واحد أو أكثر</text></g>
<text x="540" y="257" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--mono, monospace);font-size:11px">min 1 · max many</text>
<text x="620" y="239" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">Each CUSTOMER must place</text>
<text x="620" y="257" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">one or more ORDERs.</text>
<rect x="40" y="298" width="80" height="34" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="80.0" y="320" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">A</text>
<rect x="360" y="298" width="80" height="34" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="400.0" y="320" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">B</text>
<path d="M120 315 L240.0 315" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M240.0 315 L360 315" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;opacity:0.35"/>
<path d="M346 315 L360 307" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M346 315 L360 315" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M346 315 L360 323" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M346 315 L360 315" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<g class="en"><text x="180" y="307" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11.5px;font-weight:600">may</text></g><g class="ar"><text x="180" y="307" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12.5px;font-weight:600">قد</text></g>
<g class="en"><text x="540" y="313" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:700">zero or more</text></g><g class="ar"><text x="540" y="313" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:700">صفر أو أكثر</text></g>
<text x="540" y="331" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--mono, monospace);font-size:11px">min 0 · max many</text>
<text x="620" y="313" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">Each DEPARTMENT may be responsible for</text>
<text x="620" y="331" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">one or more EMPLOYEEs.</text>
<path d="M30 66 L880 66" style="stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1;fill:none"/>
<rect x="40" y="372" width="830" height="56" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="394" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">The faint half belongs to the reading in the other direction. Must/may gives the minimum; toe/crow's foot gives the maximum.</text></g><g class="ar"><text x="854" y="394" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">النصف الباهت يخصّ القراءة في الاتجاه الآخر. «يجب/قد» تعطي الحدّ الأدنى، والإصبع/قدم الغراب تعطي الحدّ الأعلى.</text></g>
<g class="en"><text x="56" y="414" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">No end ever says how many exactly: "many" is plural, not a number.</text></g><g class="ar"><text x="854" y="414" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">ولا يقول أيّ طرف العدد بالضبط: «many» تعني جمعًا، لا رقمًا.</text></g>
</svg>
