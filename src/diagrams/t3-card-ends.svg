<text x="400.0" y="98" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">B</text>
<path d="M120 93 L240.0 93" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M240.0 93 L360 93" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;opacity:0.35"/>
<g class="en"><text x="180" y="85" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11.5px;font-weight:600">must</text></g><g class="ar"><text x="180" y="85" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12.5px;font-weight:600">يجب</text></g>
<g class="en"><text x="540" y="91" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:700">exactly one</text></g><g class="ar"><text x="540" y="91" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:700">واحد بالضبط</text></g>
<text x="540" y="109" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--mono, monospace);font-size:11px">min 1 · max 1</text>
<text x="620" y="91" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">Each EMPLOYEE must work in</text>
<text x="620" y="109" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">one and only one DEPARTMENT.</text>
