<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" direction="ltr" role="img" aria-labelledby="t3-card-ends-t">
<title id="t3-card-ends-t">The four ways one reading of a relationship can end: must or may (the half beside the starting entity) combined with one and only one or one or more (the symbol at the far entity) / الطرق الأربع التي تنتهي بها قراءة واحدة للعلاقة: يجب أو قد (النصف المجاور لكيان البداية) مع واحد فقط لا غير أو واحد أو أكثر (الرمز عند الكيان البعيد)</title>
<g class="en"><text x="450.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">One reading: the half you start beside, the symbol you arrive at</text></g><g class="ar"><text x="450.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">قراءة واحدة: النصف الذي تبدأ بجانبه، والرمز الذي تصل إليه</text></g>
<g class="en"><text x="150" y="54" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11px">optionality: the half beside A</text></g><g class="ar"><text x="150" y="54" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12px">الإلزامية: النصف المجاور لـ A</text></g>
<g class="en"><text x="330" y="54" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11px">cardinality: the end at B</text></g><g class="ar"><text x="330" y="54" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12px">التعدّدية: الطرف عند B</text></g>
<g class="en"><text x="540" y="54" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11px">how many B for one A</text></g><g class="ar"><text x="540" y="54" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12px">كم B لكل A واحد</text></g>
<g class="en"><text x="735" y="54" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11px">from the slides</text></g><g class="ar"><text x="735" y="54" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12px">من الشرائح</text></g>
<rect x="40" y="76" width="80" height="34" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="80.0" y="98" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">A</text>
