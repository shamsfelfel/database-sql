<g class="en"><text x="56" y="455" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Question 1 is rule one from Lesson 3. Question 2 is the slides' reason to subdivide: a group with special properties.</text></g><g class="ar"><text x="744" y="455" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">السؤال 1 هو القاعدة الأولى من الدرس 3. والسؤال 2 هو سبب التقسيم في الشرائح: مجموعة لها سمات خاصّة.</text></g>
<g class="en"><text x="56" y="475" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Question 3 is the single basis of rule three. Question 4 is the two-level guideline: a habit, not a rule.</text></g><g class="ar"><text x="744" y="475" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">السؤال 3 هو الأساس الواحد في القاعدة الثالثة. والسؤال 4 هو إرشاد المستويين: عادة، لا قاعدة.</text></g>
