<title id="t4-subtype-decision-t">A decision chart of four questions — kind of, own properties, same basis, depth — deciding whether a group becomes a subtype, a type attribute, an attribute of the supertype, or a separate entity / مخطّط قرار من أربعة أسئلة — نوع من، سمات خاصّة، الأساس نفسه، العمق — يحدّد هل تصبح المجموعة نوعًا فرعيًّا أم خاصية نوع أم خاصية في النوع الأعلى أم كيانًا منفصلًا</title>
<g class="en"><text x="400.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Subtype, attribute or relationship? Four questions before you draw a box</text></g><g class="ar"><text x="400.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">نوع فرعي أم خاصية أم علاقة؟ أربعة أسئلة قبل أن ترسم صندوقًا</text></g>
