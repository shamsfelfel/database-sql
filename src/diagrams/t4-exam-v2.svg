<g class="en"><text x="46" y="437" text-anchor="start" style="fill:var(--dg-bad, var(--text));font-family:var(--font, sans-serif);font-size:12px">Still open: every kind of exam is taken by students, yet the line is drawn three times (red).</text></g><g class="ar"><text x="864" y="437" text-anchor="start" direction="rtl" style="fill:var(--dg-bad, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">ما زال مفتوحًا: كل أنواع الامتحان يأخذها الطلاب، ومع ذلك فالخطّ مرسوم ثلاث مرّات (بالأحمر).</text></g>
<g class="en"><text x="46" y="457" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">A fourth kind of exam would need a fourth copy of the line.</text></g><g class="ar"><text x="864" y="457" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">ونوع رابع من الامتحانات سيحتاج إلى نسخة رابعة من الخطّ.</text></g>
