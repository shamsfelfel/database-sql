<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 311" direction="ltr" role="img" aria-labelledby="t5-sales-v2-t">
<title id="t5-sales-v2-t">CUSTOMER visited by / SALES REPRESENTATIVE assigned to: solid at both ends, crow's foot at CUSTOMER: a one-to-many whose many is one or more / CUSTOMER visited by / SALES REPRESENTATIVE assigned to: متّصل عند الطرفين، رِجل غراب عند CUSTOMER: علاقة واحد إلى متعدّد متعدّدها واحد أو أكثر</title>
<g class="en"><text x="390" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">A one-to-many whose many is one or more</text></g><g class="ar"><text x="390" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">‏علاقة «واحد إلى متعدّد» متعدّدها «واحد أو أكثر»</text></g>
<rect x="40" y="50" width="210" height="76" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="145.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CUSTOMER</text>
<text x="54" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># ID</text>
<text x="54" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Name</text>
<rect x="510" y="50" width="230" height="95" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="625.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">SALES REPRESENTATIVE</text>
<text x="524" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># ID</text>
<text x="524" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* First Name</text>
<text x="524" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Last Name</text>
<path d="M250 95 L380.0 95" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M380.0 95 L510 95" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M264 95 L250 87" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M264 95 L250 95" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M264 95 L250 103" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="270" y="87" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">visited by</text>
<text x="502" y="113" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">assigned to</text>
<rect x="40" y="169" width="700" height="58" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<text x="56" y="192" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each CUSTOMER must be visited by one and only one SALES REPRESENTATIVE.</text>
<text x="56" y="213" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each SALES REPRESENTATIVE must be assigned to one or more CUSTOMERs.</text>
<rect x="40" y="241" width="700" height="56" rx="6" style="fill:var(--dg-warn-soft, var(--surface));stroke:var(--dg-warn, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="262" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Still 1:M, but the solid half at SALES REPRESENTATIVE says every representative must have a customer.</text></g><g class="ar"><text x="724" y="262" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‏ما زالت ‎1:M، لكن النصف المتّصل عند SALES REPRESENTATIVE يقول إن لكل مندوب زبونًا لا بدّ.</text></g>
<g class="en"><text x="56" y="281" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Nadia, hired today, has no customer yet: this model says she cannot exist.</text></g><g class="ar"><text x="724" y="281" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏Nadia عُيّنت اليوم وليس لها زبون بعد: وهذا النموذج يقول إنها لا يمكن أن توجد.</text></g></svg>
