<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" direction="ltr" role="img" aria-labelledby="t3-conv-names-v2-t">
<title id="t3-conv-names-v2-t">Version 2: the same three entities as softboxes named EMPLOYEE, DEPARTMENT and JOB - singular and uppercase / الإصدار 2: الكيانات الثلاثة نفسها صناديقَ مستديرة الزوايا باسم EMPLOYEE وDEPARTMENT وJOB - مفردة وبأحرف كبيرة</title>
<g class="en"><text x="450.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Version 2 — softboxes, singular, UPPERCASE</text></g><g class="ar"><text x="450.0" y="24" text-anchor="middle" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">الإصدار 2 — صناديق مستديرة، أسماء مفردة، أحرف كبيرة</text></g>
<rect x="60" y="63" width="200" height="34" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="160.0" y="85" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">EMPLOYEE</text>
<rect x="350" y="63" width="200" height="34" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="450.0" y="85" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">DEPARTMENT</text>
<rect x="640" y="63" width="200" height="34" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="740.0" y="85" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">JOB</text>
<g class="en"><text x="160" y="124" text-anchor="middle" style="fill:var(--dg-good, var(--text));font-family:var(--font, sans-serif);font-size:11.5px">softbox · singular · UPPERCASE</text></g><g class="ar"><text x="160" y="124" text-anchor="middle" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-good, var(--text));font-family:var(--font-ar, sans-serif);font-size:12.5px">صندوق مستدير · مفرد · أحرف كبيرة</text></g>
<g class="en"><text x="450" y="124" text-anchor="middle" style="fill:var(--dg-good, var(--text));font-family:var(--font, sans-serif);font-size:11.5px">softbox · singular · UPPERCASE</text></g><g class="ar"><text x="450" y="124" text-anchor="middle" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-good, var(--text));font-family:var(--font-ar, sans-serif);font-size:12.5px">صندوق مستدير · مفرد · أحرف كبيرة</text></g>
<g class="en"><text x="740" y="124" text-anchor="middle" style="fill:var(--dg-good, var(--text));font-family:var(--font, sans-serif);font-size:11.5px">softbox · singular · UPPERCASE</text></g><g class="ar"><text x="740" y="124" text-anchor="middle" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-good, var(--text));font-family:var(--font-ar, sans-serif);font-size:12.5px">صندوق مستدير · مفرد · أحرف كبيرة</text></g>
<rect x="40" y="150" width="820" height="56" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="173" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Each box names what one instance is: one employee, one department, one job.</text></g><g class="ar"><text x="844" y="173" text-anchor="start" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">كل صندوق يسمّي ما هي النسخة الواحدة: موظّف واحد، قسم واحد، وظيفة واحدة.</text></g>
<g class="en"><text x="56" y="193" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Rounded corners say "entity"; capitals say "entity name" — on any ERD, by any author.</text></g><g class="ar"><text x="844" y="193" text-anchor="start" direction="rtl" style="unicode-bidi:embed;fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">الزوايا المستديرة تقول «كيان»، والأحرف الكبيرة تقول «اسم كيان» — في أيّ مخطّط، ومن أيّ مؤلّف.</text></g>
</svg>
