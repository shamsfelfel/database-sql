<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" direction="ltr" role="img" aria-labelledby="t4-pay-subtypes-t">
<title id="t4-pay-subtypes-t">PAYMENT drawn with CASH, CHECK and CREDIT CARD as boxes inside it: the common attributes once in PAYMENT, Card Number inside CREDIT CARD, and CUSTOMER related only to CHECK and CREDIT CARD / PAYMENT مرسومًا وفي داخله صناديق CASH وCHECK وCREDIT CARD: الخصائص المشتركة مرّة واحدة في PAYMENT، ورقم البطاقة داخل CREDIT CARD، وCUSTOMER مرتبط بـ CHECK وCREDIT CARD وحدهما</title>
<g class="en"><text x="400.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Something in between — one PAYMENT, three kinds inside it</text></g><g class="ar"><text x="400.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">حلّ وسط — PAYMENT واحد، وفي داخله ثلاثة أنواع</text></g>
<rect x="40" y="50" width="260" height="266" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="170.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">PAYMENT</text>
<text x="54" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># Payment ID</text>
<text x="54" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Payment Date</text>
<text x="54" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Amount</text>
<rect x="60" y="153" width="220" height="30" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="170.0" y="175" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CASH</text>
<rect x="60" y="195" width="220" height="30" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="170.0" y="217" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CHECK</text>
<rect x="60" y="237" width="220" height="59" rx="10" style="fill:var(--dg-bg, var(--surface));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.3"/>
<text x="170.0" y="259" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CREDIT CARD</text>
<text x="74" y="281" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Card Number</text>
<rect x="560" y="143.0" width="200" height="78" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="660.0" y="165.0" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">CUSTOMER</text>
<text x="574" y="187.0" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># Customer ID</text>
<text x="574" y="206.0" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Name</text>
<path d="M280 213 L430 213" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M430 213 L430 163.0 L560 163.0" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M292 213 L280 206" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M292 213 L280 213" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M292 213 L280 220" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="310" y="206" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">made by</text>
<text x="552" y="157.0" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">make</text>
<path d="M280 255 L452 255" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M452 255 L452 193.0 L560 193.0" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M292 255 L280 248" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M292 255 L280 255" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M292 255 L280 262" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="310" y="248" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">made by</text>
<text x="552" y="208.0" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11px">make</text>
<rect x="40" y="336" width="720" height="92" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="56" y="359" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Common attributes once, in PAYMENT. Each kind keeps only what is its own, drawn inside it.</text></g><g class="ar"><text x="744" y="359" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">الخصائص المشتركة مرّة واحدة، في PAYMENT. وكل نوع لا يحمل إلا ما يخصّه، مرسومًا داخله.</text></g>
<g class="en"><text x="56" y="379" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Rules visible: * Card Number is mandatory for CREDIT CARD; the CHECK half is solid.</text></g><g class="ar"><text x="744" y="379" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">القواعد ظاهرة: رقم البطاقة إلزامي في CREDIT CARD، والنصف المجاور لـ CHECK متّصل.</text></g>
<g class="en"><text x="56" y="399" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">And one box still says what all three are: a PAYMENT. CASH has no customer line at all.</text></g><g class="ar"><text x="744" y="399" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">وصندوق واحد ما زال يقول ما هي الثلاثة كلها: PAYMENT. وليس لـ CASH خطّ زبون أصلًا.</text></g>
</svg>
