<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" direction="ltr" role="img" aria-labelledby="t5-enrollment-t">
<title id="t5-enrollment-t">STUDENT enrols for / ENROLLMENT for / SUBJECT subject of: the intersection entity ENROLLMENT with o Grade, crow's feet at ENROLLMENT on both lines, solid at ENROLLMENT and dashed at the parents: two one-to-many relationships / STUDENT enrols for / ENROLLMENT for / SUBJECT subject of: كيان التقاطع ENROLLMENT مع o Grade، ورِجلا الغراب عند ENROLLMENT في الخطين، متّصل عند ENROLLMENT ومتقطّع عند الأبوين: علاقتا واحد إلى متعدّد</title>
<g class="en"><text x="430.0" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">The intersection entity — one M:M becomes two 1:Ms</text></g><g class="ar"><text x="430.0" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">‏كيان التقاطع — علاقة ‎M:M واحدة تصير علاقتَي ‎1:M</text></g>
<rect x="20" y="50" width="180" height="99" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="110.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">STUDENT</text>
<text x="32" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># ID</text>
<text x="32" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* First Name</text>
<text x="32" y="132" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Last Name</text>
<rect x="340" y="50" width="180" height="61" rx="10" style="fill:var(--dg-good-soft, var(--accent-soft));stroke:var(--dg-good, var(--accent));stroke-width:2"/>
<text x="430.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">ENROLLMENT</text>
<text x="352" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">o Grade</text>
<rect x="660" y="50" width="180" height="80" rx="10" style="fill:var(--dg-node-fill, var(--accent-soft));stroke:var(--dg-node-stroke, var(--accent));stroke-width:1.5"/>
<text x="750.0" y="72" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">SUBJECT</text>
<text x="672" y="94" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px"># ID</text>
<text x="672" y="113" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Name</text>
<path d="M200 95 L270.0 95" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M270.0 95 L340 95" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M326 95 L340 87" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M326 95 L340 95" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M326 95 L340 103" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="208" y="85" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">enrols for</text>
<text x="320" y="115" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">for</text>
<path d="M520 95 L590.0 95" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M590.0 95 L660 95" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none;stroke-dasharray:6 4"/>
<path d="M534 95 L520 87" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M534 95 L520 95" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<path d="M534 95 L520 103" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.6;fill:none"/>
<text x="540" y="85" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">for</text>
<text x="652" y="115" text-anchor="end" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:11.5px">subject of</text>
<rect x="20" y="176" width="820" height="98" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1"/>
<text x="36" y="200" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each STUDENT may enrol for one or more ENROLLMENTs.</text>
<text x="36" y="221" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each ENROLLMENT must be for one and only one STUDENT.</text>
<text x="36" y="242" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each ENROLLMENT must be for one and only one SUBJECT.</text>
<text x="36" y="263" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12px">Each SUBJECT may be the subject of one or more ENROLLMENTs.</text>
<rect x="20" y="288" width="820" height="92" rx="6" style="fill:var(--dg-good-soft, var(--surface));stroke:var(--dg-good, var(--text-soft));stroke-width:1"/>
<g class="en"><text x="36" y="310" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Both crow's feet now point at ENROLLMENT: it is the child of both lines.</text></g><g class="ar"><text x="824" y="310" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‏رِجلا الغراب تشيران الآن إلى ENROLLMENT: فهو الابن في الخطّين كليهما.</text></g>
<g class="en"><text x="36" y="329" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Solid at ENROLLMENT: an enrollment cannot exist without its student and its subject.</text></g><g class="ar"><text x="824" y="329" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏متّصل عند ENROLLMENT: لا يوجد تسجيل بلا طالبه ومادّته.</text></g>
<g class="en"><text x="36" y="348" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">Dashed at the parents, as in the M:M: a student or a subject may have no enrollments.</text></g><g class="ar"><text x="824" y="348" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏متقطّع عند الأبوين، كما في ‎M:M: قد لا يكون للطالب أو للمادة أيّ تسجيل.</text></g>
<g class="en"><text x="36" y="367" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">No # in ENROLLMENT yet. What identifies an enrollment is Lesson 6's question.</text></g><g class="ar"><text x="824" y="367" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏لا # في ENROLLMENT بعد. وما الذي يميّز التسجيل هو سؤال الدرس 6.</text></g>
</svg>