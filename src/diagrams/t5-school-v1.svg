<g class="en"><text x="46" y="211" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:12px">Defect: Sara can never leave the Algebra Circle. To move her, the model forces you to delete her link and lose her history.</text></g><g class="ar"><text x="854" y="211" text-anchor="start" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:13px">‏العيب: لا تستطيع Sara أبدًا أن تترك Algebra Circle. ولنقلها يجبرك النموذج على حذف ارتباطها وفقدان سجلّها.</text></g>
<g class="en"><text x="46" y="230" text-anchor="start" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:12px">The business never asked for that: students are allowed to change groups.</text></g><g class="ar"><text x="854" y="230" text-anchor="start" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:13px">‏ولم يطلب العمل ذلك: فالطلاب مسموح لهم بتغيير المجموعة.</text></g></svg>
