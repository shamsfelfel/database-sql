<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" direction="ltr" role="img" aria-labelledby="t2-volatile-t">
<title id="t2-volatile-t">Sara's age changes every year and must be updated; her birth date never changes / عمر Sara يتغيّر كل سنة ويجب تحديثه، وتاريخ ميلادها لا يتغيّر أبدًا</title>
<g class="en"><text x="450" y="24" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:13px;font-weight:600">Volatile Age against non-volatile Birth Date</text></g><g class="ar"><text x="450" y="24" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:14px;font-weight:600">العمر المتقلّب مقابل تاريخ الميلاد غير المتقلّب</text></g>
<rect x="30" y="52" width="200" height="62" rx="10" style="fill:var(--dg-warn-soft, var(--warn-soft));stroke:var(--dg-warn, var(--warn));stroke-width:1.4"/>
<text x="130" y="74" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:13px;font-weight:700">MEMBER</text>
<text x="44" y="98" text-anchor="start" style="fill:var(--dg-text, var(--text));font-family:var(--mono, monospace);font-size:12.5px">* Age</text>
