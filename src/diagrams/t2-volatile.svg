<text x="575" y="112" text-anchor="middle" style="fill:var(--dg-warn, var(--warn));font-family:var(--mono, monospace);font-size:11px;font-weight:700">UPDATE</text>
<path d="M230 83 L290 83" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.1;fill:none;stroke-dasharray:2 3"/>
<g class="en"><text x="740" y="128" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11.5px">volatile: must be rewritten every year</text></g><g class="ar"><text x="740" y="128" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12.5px">متقلّبة: يجب أن تُعاد كتابتها كل سنة</text></g>
<rect x="30" y="160" width="200" height="62" rx="10" style="fill:var(--dg-good-soft, var(--good-soft));stroke:var(--dg-good, var(--good));stroke-width:1.4"/>
