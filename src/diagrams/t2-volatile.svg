<text x="650" y="168" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--mono, monospace);font-size:11.5px">2027</text>
<rect x="590" y="176" width="120" height="30" rx="3" style="fill:var(--dg-alt-fill, var(--surface-2));stroke:var(--dg-alt-stroke, var(--text-soft));stroke-width:1.4"/>
