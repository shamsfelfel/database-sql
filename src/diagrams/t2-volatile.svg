<path d="M230 191 L290 191" style="stroke:var(--dg-line, var(--text-soft));stroke-width:1.1;fill:none;stroke-dasharray:2 3"/>
<g class="en"><text x="740" y="236" text-anchor="middle" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font, sans-serif);font-size:11.5px">non-volatile: stored once, never changes</text></g><g class="ar"><text x="740" y="236" text-anchor="middle" direction="rtl" style="fill:var(--dg-text-soft, var(--text-soft));font-family:var(--font-ar, sans-serif);font-size:12.5px">غير متقلّبة: تُخزَّن مرّة، ولا تتغيّر أبدًا</text></g>
<rect x="30" y="262" width="840" height="32" rx="6" style="fill:var(--dg-note-fill, var(--surface));stroke:var(--dg-note-stroke, var(--text-soft));stroke-width:1.4"/>
<g class="en"><text x="450" y="283" text-anchor="middle" style="fill:var(--dg-text, var(--text));font-family:var(--font, sans-serif);font-size:11.5px">One million members means one million updates a year for Age — and none for Birth Date, from which age can be worked out.</text></g><g class="ar"><text x="450" y="283" text-anchor="middle" direction="rtl" style="fill:var(--dg-text, var(--text));font-family:var(--font-ar, sans-serif);font-size:12.5px">مليون عضو يعني مليون تحديث في السنة للعمر — ولا تحديث لتاريخ الميلاد، الذي يمكن أن يُستنتج منه العمر.</text></g>
</svg>
